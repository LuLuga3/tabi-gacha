<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎡 旅ルーレット</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:
    -apple-system,BlinkMacSystemFont,"Noto Sans JP",
    "Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  background:linear-gradient(180deg,#fff7ed,#eef8ff);
  color:#222;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px 15px 40px;
}

h1{
  text-align:center;
  margin:5px 0 5px;
  font-size:30px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:22px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:bold;
  margin:13px 0 6px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

.mode{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.mode button{
  border:0;
  border-radius:18px;
  padding:18px 8px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  background:#f2f2f2;
}

.mode button.active{
  background:linear-gradient(135deg,#ff8a00,#ff4d4d);
  color:white;
  box-shadow:0 6px 15px rgba(255,90,40,.3);
}

.mode .world.active{
  background:linear-gradient(135deg,#267cff,#7b4dff);
}

#roulette{
  width:280px;
  height:280px;
  margin:20px auto;
  border-radius:50%;
  background:
    conic-gradient(
      #ff6b6b 0deg 45deg,
      #ffd93d 45deg 90deg,
      #6bcB77 90deg 135deg,
      #4d96ff 135deg 180deg,
      #c77dff 180deg 225deg,
      #ff9f1c 225deg 270deg,
      #00b4d8 270deg 315deg,
      #ff70a6 315deg 360deg
    );
  border:10px solid white;
  box-shadow:0 8px 30px rgba(0,0,0,.2);
  position:relative;
  transition:transform 5s cubic-bezier(.12,.75,.18,1);
}

#roulette::after{
  content:"";
  position:absolute;
  width:55px;
  height:55px;
  border-radius:50%;
  background:white;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 3px 8px rgba(0,0,0,.2);
}

.pointer{
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:35px solid #222;
  margin:0 auto -10px;
  position:relative;
  z-index:5;
}

.result{
  text-align:center;
  min-height:100px;
  padding:10px;
}

.result .country{
  font-size:15px;
  color:#777;
}

.result .place{
  font-size:32px;
  font-weight:900;
  margin:5px 0;
}

.result .mission{
  font-size:16px;
  color:#555;
}

.start{
  width:100%;
  border:0;
  border-radius:18px;
  padding:18px;
  font-size:22px;
  font-weight:900;
  color:white;
  background:linear-gradient(135deg,#ff512f,#dd2476);
  box-shadow:0 8px 20px rgba(220,40,90,.3);
  cursor:pointer;
}

.start:active{
  transform:scale(.97);
}

.stop{
  display:none;
  width:100%;
  border:0;
  border-radius:18px;
  padding:18px;
  font-size:22px;
  font-weight:900;
  color:white;
  background:#222;
  cursor:pointer;
}

.info{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:12px;
}

.hidden{
  display:none;
}

.share{
  width:100%;
  border:0;
  border-radius:14px;
  padding:13px;
  background:#f1f1f1;
  font-weight:bold;
  margin-top:10px;
}

.keyword-box{
  background:#fff8df;
  border-radius:14px;
  padding:12px;
  margin-top:12px;
  font-size:14px;
}

.flash{
  animation:pop .5s ease;
}

@keyframes pop{
  0%{transform:scale(.7);opacity:.2}
  70%{transform:scale(1.08)}
  100%{transform:scale(1);opacity:1}
}
</style>
</head>

<body>

<div class="container">

<h1>🎡 旅ルーレット</h1>
<div class="subtitle">次の旅、運に任せてみない？</div>

<div class="card">

<label>📍 出発地</label>
<input id="from" placeholder="例：東京、大阪、札幌">

<label>📅 旅行する日</label>
<input id="date" type="date">

<label>💰 予算</label>
<select id="budget" style="
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;">
<option>特に決めてない</option>
<option>1万円以内</option>
<option>3万円以内</option>
<option>5万円以内</option>
<option>10万円以内</option>
<option>10万円以上</option>
</select>

<label>🎯 旅のキーワード</label>
<input id="keyword" placeholder="例：温泉、絶景、グルメ、推し活">

<div class="keyword-box">
💡 キーワードを入れると、当選した場所に合わせて
「旅のミッション」が表示されます。
</div>

</div>

<div class="card">

<h2 style="text-align:center">🌏 どこへ行く？</h2>

<div class="mode">

<button id="japanBtn" onclick="selectMode('japan')">
🇯🇵<br>日本
</button>

<button id="worldBtn" class="world" onclick="selectMode('world')">
🌎<br>世界
</button>

</div>

</div>

<div class="card">

<div class="pointer"></div>

<div id="roulette"></div>

<button class="start" id="startBtn" onclick="startRoulette()">
🎰 START
</button>

<button class="stop" id="stopBtn" onclick="stopRoulette()">
🛑 STOP
</
