<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>旅ルーレット</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Noto Sans JP",
  sans-serif;

  background:linear-gradient(135deg,#eef7ff,#fff4e8);
  color:#222;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:25px 15px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
  opacity:.85;
}

main{
  max-width:620px;
  margin:auto;
  padding:18px 14px 50px;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 6px 25px rgba(0,0,0,.08);
}

h2{
  text-align:center;
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

input,
select{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  background:white;
}

.hint{
  font-size:13px;
  color:#777;
  margin-top:7px;
}

button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:15px;
  font-size:19px;
  font-weight:bold;
  color:white;
  background:#2563eb;
  margin-top:15px;
}

button:active{
  transform:scale(.97);
}

button:disabled{
  background:#aaa;
}

.stop{
  background:#ef4444;
}

.secondary{
  background:#111827;
}

.green{
  background:#16a34a;
}

.hidden{
  display:none;
}

/* ルーレット */

.wheelArea{
  position:relative;
  width:310px;
  height:310px;
  margin:25px auto;
}

.pointer{
  position:absolute;
  z-index:10;
  top:-15px;
  left:50%;
  transform:translateX(-50%);
  font-size:45px;
}

#wheel{
  width:300px;
  height:300px;
  border-radius:50%;
  border:8px solid white;
  box-shadow:0 7px 25px rgba(0,0,0,.2);
}

/* 結果 */

.result{
  display:none;
  text-align:center;
}

.resultEmoji{
  font-size:65px;
}

.destination{
  font-size:36px;
  font-weight:bold;
  margin:5px 0;
}

.catch{
  color:#555;
  line-height:1.7;
}

/* ミッション */

.mission{
  background:#f3f4f6;
  border-radius:13px;
  padding:15px;
  margin:9px 0;
  text-align:left;
  line-height:1.6;
}

.mission input{
  width:auto;
  margin-right:8px;
}

/* 特別情報 */

.special{
  background:#fff7d6;
  border:2px solid #f6c344;
  border-radius:15px;
  padding:16px;
  margin-top:18px;
  text-align:left;
  line-height:1.7;
}

.special h3{
  margin-top:0;
}

.warning{
  background:#fff1f2;
  border:2px solid #f87171;
  border-radius:15px;
  padding:15px;
  margin-top:12px;
  text-align:left;
  line-height:1.6;
}

.info{
  background:#f8fafc;
  border-radius:13px;
  padding:15px;
  margin-top:12px;
  text-align:left;
  line-height:1.7;
}

.tag{
  display:inline-block;
  background:#e0f2fe;
  color:#0369a1;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  margin:3px;
}

footer{
  text-align:center;
  color:#777;
  font-size:12px;
  padding:20px;
}

</style>
</head>

<header>

<h1>🎡 旅ルーレット</h1>

<p>
行き先は運に任せて、旅の目的はあなたが決める。
</p>

</header>


<main>


<!-- 旅の目的 -->

<div class="card">

<h2>🎯 今回の旅の目的</h2>

<input
  id="keyword"
  type="text"
  placeholder="例：ちいかわ、ラーメン、推し活、温泉"
/>

<div class="hint">
好きなもの・やりたいことを自由に入力してください。
</div>

</div>


<!-- 旅の範囲 -->

<div class="card">

<h2>🌏 旅の範囲</h2>

<label>行き先</label>

<select id="area">

<option value="all">
🌏 日本＋世界
</option>

<option value="japan">
🗾 日本
</option>

<option value="world">
🌎 世界
</option>

</select>

</div>


<!-- ルーレット -->

<div class="card">

<h2>🎡 運命の旅先</h2>

<div class="wheelArea">

<div class="pointer">▼</div>

<canvas
id="wheel"
width="300"
height="300">
</canvas>

</div>


<button
id="startButton"
onclick="startRoulette()">

🎡 ルーレットを回す！

</button>


<button
id="stopButton"
class="stop"
onclick="stopRoulette()"
disabled>

🛑 STOP！

</button>

</div>


<!-- 結果 -->

<div
class="card result"
id="result">

<div
class="resultEmoji"
id="resultEmoji">
🎉
</div>


<div
class="destination"
id="destination">
</div>


<p
class="catch"
id="catch">
</p>


<!-- 安全 -->

<div id="safety"></div>


<!-- ミッション -->

<h2>
🎯 あなた専用ミッション
</h2>


<div class="mission">

<label style="display:inline">

<input
type="checkbox">

<span id="mission1"></span>

</label>

</div>


<div class="mission">

<label style="display:inline">

<input
type="checkbox">

<span id="mission2"></span>

</label>

</div>


<div class="mission">

<label style="display:inline">

<input
type="checkbox">

<span id="mission3"></span>

</label>

</div>


<!-- 特別情報 -->

<div
class="special"
id="special">
</div>


<!-- グルメ -->

<div class="info">

<strong>
🍴 ご当地グルメ
</strong>

<br>

<span id="food"></span>

</div>


<!-- 予算 -->

<div class="info">

<strong>
💰 予算目安
</strong>

<br>

<span id="price"></span>

</div>


<button
class="secondary"
onclick="searchHotel()">

🏨 ホテルを探す

</button>


<button
class="secondary"
onclick="searchTransport()">

🚆 交通を調べる

</button>


<button
class="green"
onclick="shareResult()">

📱 友達にシェア

</button>


<button
onclick="location.reload()">

🔄 もう一度！

</button>


</div>

</main>


<footer>

旅ルーレット © 2026

</footer>

let candidates=[];
let spinning=false;

let animation;
let current=null;


const canvas=
document.getElementById("wheel");

const ctx=
canvas.getContext("2d");


/* =========================
   候補作成
========================= */

function setCandidates(){

const area=
document.getElementById("area").value;


if(area==="all"){

candidates=[...places];

}

else{

candidates=
places.filter(
p=>p.area===area
);

}


drawWheel();

}


document.getElementById("area")
.addEventListener(
"change",
setCandidates
);


/* =========================
   ルーレット描画
========================= */

function drawWheel(){

ctx.clearRect(
0,
0,
300,
300
);


const center=150;
const radius=142;

const slice=
Math.PI*2/candidates.length;


const colors=[
"#60a5fa",
"#fbbf24",
"#f87171",
"#34d399",
"#a78bfa",
"#fb923c",
"#38bdf8",
"#f472b6"
];


candidates.forEach(
(trip,i)=>{

const start=
i*slice;

const end=
start+slice;


ctx.beginPath();

ctx.moveTo(
center,
center
);

ctx.arc(
center,
center,
radius,
start,
end
);

ctx.closePath();

ctx.fillStyle=
colors[i%colors.length];

ctx.fill();


ctx.save();

ctx.translate(
center,
center
);

ctx.rotate(
start+slice/2
);

ctx.fillStyle="white";

ctx.font=
"bold 13px sans-serif";

ctx.textAlign="right";

ctx.fillText(
trip.name,
radius-10,
5
);

ctx.restore();

});

}
