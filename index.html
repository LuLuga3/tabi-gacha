<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎡 旅ガチャ｜次の旅を運で決めよう</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:linear-gradient(180deg,#fff8ef,#eef7ff);color:#222}
.container{width:100%;max-width:560px;margin:auto;padding:18px 14px 50px}
h1{text-align:center;font-size:31px;margin:5px 0}
.subtitle{text-align:center;color:#777;margin-bottom:18px}
.card{background:#fff;border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 8px 25px rgba(0,0,0,.08)}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px;background:#fff}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode button{border:0;border-radius:18px;padding:17px 8px;font-size:18px;font-weight:bold;background:#eee;cursor:pointer}
.mode button.active{color:#fff;background:linear-gradient(135deg,#ff8a00,#ff4d4d)}
.mode button.world.active{background:linear-gradient(135deg,#287cff,#754cff)}
.roulette-area{position:relative;width:min(94vw,500px);aspect-ratio:1;margin:10px auto 18px}
.pointer{position:absolute;z-index:20;left:50%;top:-3px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:38px solid #222}
canvas{width:100%;height:100%;border-radius:50%;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.center{position:absolute;width:62px;height:62px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:5px solid #222;z-index:10;display:flex;align-items:center;justify-content:center;font-size:25px}
.start,.stop{width:100%;border:0;border-radius:18px;padding:17px;font-size:22px;font-weight:900;color:#fff;cursor:pointer}
.start{background:linear-gradient(135deg,#ff512f,#dd2476)}
.stop{display:none;background:#222}
.note{text-align:center;color:#888;font-size:12px;margin-top:9px}
.result-card{margin-top:18px;padding:18px;border-radius:20px;background:linear-gradient(135deg,#fffaf1,#f5f8ff);border:2px solid #eee;text-align:center}
.result-title{font-size:14px;color:#777}
.result-place{font-size:34px;font-weight:900;margin:5px 0 8px}
.result-mission{font-size:16px;line-height:1.6}
.difficulty{margin:10px 0;font-size:15px}
.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#fff;font-size:13px;font-weight:bold}
.mission-box{background:#fff;border-radius:16px;padding:13px;margin-top:12px;text-align:left}
.mission-title{font-weight:bold;margin-bottom:4px}
.retry-title{text-align:center;font-weight:bold;font-size:18px;margin-bottom:12px}
.retry-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.retry-grid button{border:0;padding:13px 5px;border-radius:14px;background:#f0f0f0;font-size:14px;font-weight:bold}
.share{width:100%;border:0;border-radius:14px;padding:14px;background:#222;color:#fff;font-size:16px;font-weight:bold;margin-top:12px}
.hotel-btn{display:block;width:100%;text-decoration:none;border:0;border-radius:16px;padding:16px;background:linear-gradient(135deg,#ff8a00,#ff4d4d);color:#fff;font-size:18px;font-weight:900;margin-top:14px}
.hotel-btn small{display:block;font-size:11px;font-weight:normal;margin-top:3px}
.area-box{background:#fff;border:1px solid #eee;border-radius:16px;padding:14px;margin-top:14px}
.area-title{font-weight:900;font-size:17px;margin-bottom:7px}
.area-sub{font-size:13px;color:#777}
.hotel-gacha{margin-top:14px;padding:15px;border-radius:17px;background:#fff;border:1px solid #eee;text-align:center}
.hotel-gacha-title{font-size:19px;font-weight:900}
.hotel-name{font-size:24px;font-weight:900;margin:10px 0}
.hotel-tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.hotel-tag{font-size:12px;background:#f3f3f3;border-radius:20px;padding:5px 9px}
.hotel-spin{border:0;border-radius:13px;padding:12px 18px;background:#222;color:#fff;font-weight:900;margin-top:10px}
.hidden{display:none!important}
.pop{animation:pop .55s ease}
@keyframes pop{0%{transform:scale(.5);opacity:0}65%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.complete{background:#222;color:#fff}
@media(max-width:380px){h1{font-size:27px}.result-place{font-size:28px}}
</style>
</head>

<body>
<div class="container">

<h1>🎡 旅ガチャ</h1>
<div class="subtitle">次の旅、運に任せてみない？</div>

<div class="card">
<label>📍 出発地</label>
<input id="from" type="text" placeholder="例：東京・大阪・名古屋">

<label>📅 旅行する日</label>
<input id="date" type="date">

<label>💰 予算</label>
<select id="budget">
<option>特に決めてない</option>
<option>1万円以内</option>
<option>3万円以内</option>
<option>5万円以内</option>
<option>10万円以内</option>
<option>10万円以上</option>
</select>

<label>🎯 旅のキーワード</label>
<input id="keyword" type="text" placeholder="温泉・グルメ・絶景・推し活など">
</div>

<div class="card">
<h2 style="text-align:center;margin-top:0">🌏 どこへ行く？</h2>

<div class="mode">
<button id="japanBtn" class="active" onclick="selectMode('japan')">
🇯🇵<br>日本
</button>

<button id="worldBtn" class="world" onclick="selectMode('world')">
🌎<br>世界
</button>
</div>
</div>

<div class="card">

<div class="roulette-area">
<div class="pointer"></div>
<canvas id="roulette"></canvas>
<div class="center">🎯</div>
</div>

<button id="startBtn" class="start" onclick="startRoulette()">
🎰 START
</button>

<button id="stopBtn" class="stop" onclick="stopRoulette()">
🛑 STOP
</button>

<div class="note">
回転中にSTOPを押すと、その場所で決定！
</div>

<div id="resultCard" class="result-card">

<div id="resultTitle" class="result-title">
日本の47都道府県
</div>

<div id="resultPlace" class="result-place">
？？？
</div>

<div id="resultMission" class="result-mission">
STARTを押して旅先を決めよう！
</div>

<div id="hokkaidoArea" class="area-box hidden">
<div class="area-title">
❄️ 北海道が当たりました！
</div>
<div class="area-sub">
北海道は広いので、主要6エリアからさらに抽選します。
</div>
</div>

<div id="hotelArea" class="hidden"></div>

</div>

<div id="retryBox" class="hidden" style="margin-top:18px">

<div class="retry-title">
🔄 もう一回、条件を変えて回す？
</div>

<div class="retry-grid">
<button onclick="retry('random')">🎲 完全ランダム</button>
<button onclick="retry('near')">📍 近場を除外</button>
<button onclick="retry('onsen')">♨️ 温泉旅</button>
<button onclick="retry('food')">🍜 グルメ旅</button>
<button onclick="retry('view')">📸 絶景旅</button>
<button onclick="retry('adventure')">🔥 冒険旅</button>
</div>

</div>

<button id="completeBtn" class="share hidden" onclick="completeMission()">
🏆 ミッション達成！
</button>

<button id="shareBtn" class="share hidden" onclick="shareResult()">
📱 この結果をシェア
</button>

</div>
</div>

<script>

const japan=[
"北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県",
"茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県",
"新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県",
"三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県",
"鳥取県","島根県","岡山県","広島県","山口県",
"徳島県","香川県","愛媛県","高知県",
"福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"

const world=[
"🇰🇷 ソウル","🇰🇷 釜山","🇹🇼 台北","🇹🇼 台中","🇭🇰 香港",
"🇹🇭 バンコク","🇹🇭 プーケット","🇻🇳 ホーチミン","🇻🇳 ダナン",
"🇸🇬 シンガポール","🇲🇾 クアラルンプール","🇮🇩 バリ","🇵🇭 セブ",
"🇦🇺 シドニー","🇦🇺 ゴールドコースト","🇺🇸 ハワイ",
"🇺🇸 ニューヨーク","🇺🇸 ロサンゼルス","🇨🇦 バンクーバー",
"🇫🇷 パリ","🇬🇧 ロンドン","🇮🇹 ローマ","🇪🇸 バルセロナ",
"🇵🇹 リスボン","🇨🇭 スイス","🇩🇪 ベルリン","🇳🇱 アムステルダム",
"🇦🇹 ウィーン","🇬🇷 サントリーニ","🇹🇷 イスタンブール",
"🇪🇬 カイロ","🇦🇪 ドバイ","🇳🇿 オークランド",
"🇫🇮 ヘルシンキ","🇸🇪 ストックホルム","🇩🇰 コペンハーゲン",
"🇨🇿 プラハ","🇲🇽 カンクン","🇵🇪 マチュピチュ"

const hokkaidoAreas=[
{name:"札幌",emoji:"🏙️",url:"https://a.r10.to/hPPMCt"},
{name:"函館",emoji:"🏮",url:"https://a.r10.to/hPJvth"},
{name:"小樽",emoji:"🧱",url:"https://a.r10.to/hk5v7l"},
{name:"旭川",emoji:"🐻",url:"https://a.r10.to/hF1xVQ"},
{name:"登別",emoji:"♨️",url:"https://a.r10.to/h5QccX"},
{name:"富良野",emoji:"🌸",url:"https://a.r10.to/hRubqK"}
];

const hotelCandidates={

"札幌":[
{name:"札幌駅周辺ホテル",tags:["駅近","街歩き"]},
{name:"大通公園周辺ホテル",tags:["観光","便利"]},
{name:"すすきの周辺ホテル",tags:["グルメ","夜遊び"]},
{name:"中島公園周辺ホテル",tags:["静か","公園"]},
{name:"札幌市内の温泉宿",tags:["温泉","癒やし"]}
],

"函館":[
{name:"函館駅周辺ホテル",tags:["駅近","アクセス"]},
{name:"ベイエリア周辺ホテル",tags:["夜景","観光"]},
{name:"五稜郭周辺ホテル",tags:["街歩き","便利"]},
{name:"湯の川温泉の宿",tags:["温泉","海"]},
{name:"函館の人気ホテル",tags:["定番","旅行"]}
],

"小樽":[
{name:"小樽駅周辺ホテル",tags:["駅近","便利"]},
{name:"小樽運河周辺ホテル",tags:["運河","観光"]},
{name:"堺町通り周辺ホテル",tags:["食べ歩き","街歩き"]},
{name:"小樽の温泉宿",tags:["温泉","癒やし"]},
{name:"小樽の人気ホテル",tags:["定番","旅行"]}
],

"旭川":[
{name:"旭川駅周辺ホテル",tags:["駅近","便利"]},
{name:"旭山動物園周辺の宿",tags:["動物園","家族旅"]},
{name:"旭川市内のホテル",tags:["街歩き","グルメ"]},
{name:"旭川の温泉宿",tags:["温泉","癒やし"]},
{name:"旭川の人気ホテル",tags:["定番","旅行"]}
],

"登別":[
{name:"登別温泉の宿",tags:["温泉","人気"]},
{name:"登別温泉街の旅館",tags:["旅館","温泉"]},
{name:"登別の露天風呂のある宿",tags:["露天風呂","癒やし"]},
{name:"登別の人気ホテル",tags:["定番","旅行"]},
{name:"登別の温泉旅館",tags:["温泉","ゆっくり"]}
],

"富良野":[
{name:"富良野駅周辺ホテル",tags:["駅近","便利"]},
{name:"富良野のリゾートホテル",tags:["リゾート","絶景"]},
{name:"富良野のコテージ・宿",tags:["自然","のんびり"]},
{name:"富良野の人気ホテル",tags:["定番","旅行"]},
{name:"富良野周辺の温泉宿",tags:["温泉","自然"]}
]
};

const canvas=document.getElementById("roulette");
const ctx=canvas.getContext("2d");

let mode="japan";
let spinning=false;
let rotation=0;
let selectedIndex=0;
let selectedPlace="";
let currentMission="";
let currentDifficulty="";
let selectedArea=null;

function resizeCanvas(){
canvas.width=900;
canvas.height=900;
drawRoulette();
}

resizeCanvas();
window.addEventListener("resize",resizeCanvas);

function drawRoulette(){

const list=mode==="japan"?japan:world;
const size=canvas.width;
const center=size/2;
const radius=size/2-10;
const count=list.length;
const slice=Math.PI*2/count;

ctx.clearRect(0,0,size,size);

const colors=[
"#ff6b6b","#ffd93d","#6bcb77","#4d96ff",
"#c77dff","#ff9f1c","#00b4d8","#ff70a6"
];

for(let i=0;i<count;i++){

const start=-Math.PI/2+i*slice;
const end=start+slice;

ctx.beginPath();
ctx.moveTo(center,center);
ctx.arc(center,center,radius,start,end);
ctx.closePath();

ctx.fillStyle=colors[i%colors.length];
ctx.fill();

ctx.strokeStyle="rgba(255,255,255,.9)";
ctx.lineWidth=3;
ctx.stroke();

const middle=start+slice/2;

ctx.save();
ctx.translate(center,center);
ctx.rotate(middle);
ctx.textAlign="right";
ctx.textBaseline="middle";

ctx.font=
(list[i].length>9?
"bold 17px sans-serif":
mode==="japan"?
"bold 22px sans-serif":
"bold 20px sans-serif");

ctx.fillStyle="#222";
ctx.fillText(list[i],radius-18,0);

ctx.restore();
}

ctx.beginPath();
ctx.arc(center,center,radius,0,Math.PI*2);
ctx.strokeStyle="#fff";
ctx.lineWidth=12;
ctx.stroke();

ctx.beginPath();
ctx.arc(center,center,48,0,Math.PI*2);
ctx.fillStyle="#fff";
ctx.fill();
}

function selectMode(type){

if(spinning)return;

mode=type;

document.getElementById("japanBtn")
.classList.toggle("active",type==="japan");

document.getElementById("worldBtn")
.classList.toggle("active",type==="world");

drawRoulette();
resetResult();

document.getElementById("resultTitle").textContent=
type==="japan"?
"🇯🇵 日本の47都道府県":
"🌎 世界の旅先";
}

function resetResult(){

document.getElementById("resultPlace").textContent="？？？";

document.getElementById("resultMission").textContent=
"STARTを押して旅先を決めよう！";

document.getElementById("retryBox").classList.add("hidden");

document.getElementById("shareBtn").classList.add("hidden");

document.getElementById("completeBtn").classList.add("hidden");

document.getElementById("hokkaidoArea").classList.add("hidden");

document.getElementById("hotelArea").classList.add("hidden");

selectedArea=null;
}

function startRoulette(){

if(spinning)return;

spinning=true;

document.getElementById("startBtn").style.display="none";
document.getElementById("stopBtn").style.display="block";

document.getElementById("retryBox").classList.add("hidden");
document.getElementById("shareBtn").classList.add("hidden");
document.getElementById("completeBtn").classList.add("hidden");

document.getElementById("hotelArea").classList.add("hidden");
document.getElementById("hokkaidoArea").classList.add("hidden");

const list=mode==="japan"?japan:world;

selectedIndex=Math.floor(Math.random()*list.length);
selectedPlace=list[selectedIndex];

const slice=360/list.length;
const targetAngle=selectedIndex*slice+slice/2;
const current=rotation%360;

const extraSpins=6+Math.floor(Math.random()*4);

let target=rotation+extraSpins*360;

target+=(360-targetAngle-current+360)%360;

rotation=target;

canvas.style.transition=
"transform 5s cubic-bezier(.12,.75,.15,1)";

canvas.style.transform=
`rotate(${rotation}deg)`;

document.getElementById("resultTitle").textContent=
"🎰 回転中……";

document.getElementById("resultPlace").textContent="？？？";

document.getElementById("resultMission").textContent=
"STOPで旅先決定！";

setTimeout(()=>{
if(spinning)stopRoulette();
},5100);
}

function stopRoulette(){

if(!spinning)return;

spinning=false;

document.getElementById("startBtn").style.display="block";
document.getElementById("stopBtn").style.display="none";

showResult();
}

function showResult(){

document.getElementById("resultTitle").textContent=
mode==="japan"?
"🇯🇵 今回の旅先":
"🌎 今回の旅先";

const place=document.getElementById("resultPlace");

place.textContent=selectedPlace;

place.classList.remove("pop");
void place.offsetWidth;
place.classList.add("pop");

if(mode==="japan" && selectedPlace==="北海道"){

showHokkaidoArea();

}else{

selectedArea=null;

document.getElementById("hokkaidoArea")
.classList.add("hidden");

document.getElementById("hotelArea")
.classList.add("hidden");

setMissionAndControls(selectedPlace);
}
}

function showHokkaidoArea(){

document.getElementById("hokkaidoArea")
.classList.remove("hidden");

document.getElementById("resultMission").innerHTML=`

<div class="difficulty">
北海道は広いので、さらにエリアを決定します。
</div>

<div class="mission-box">

<div class="mission-title">
🎲 北海道エリアガチャ
</div>

札幌・函館・小樽・旭川・登別・富良野から、
今回の宿泊エリアを決めます！

</div>
`;

document.getElementById("retryBox")
.classList.add("hidden");

document.getElementById("completeBtn")
.classList.add("hidden");

document.getElementById("shareBtn")
.classList.add("hidden");

setTimeout(()=>{

selectedArea=
hokkaidoAreas[
Math.floor(Math.random()*hokkaidoAreas.length)
];

document.getElementById("resultPlace").textContent=
`北海道・${selectedArea.name}`;

document.getElementById("resultPlace")
.classList.add("pop");

setMissionAndControls(
`北海道・${selectedArea.name}`,
selectedArea
);

},500);
}

function setMissionAndControls(place,area=null){

const keyword=
document.getElementById("keyword").value.trim();

const mission=createMission(place,keyword);

currentMission=mission.text;
currentDifficulty=mission.difficulty;

document.getElementById("resultMission").innerHTML=`

<div class="difficulty">
難易度：
<span class="badge">
${mission.difficulty}
</span>
</div>

<div class="mission-box">

<div class="mission-title">
🎯 今日の旅ミッション
</div>

${mission.text}

</div>
`;

document.getElementById("retryBox")
.classList.remove("hidden");

document.getElementById("completeBtn")
.classList.remove("hidden");

document.getElementById("shareBtn")
.classList.remove("hidden");

if(area){
showHotelGacha(area);
}
}

function showHotelGacha(area){

const hotel=document.getElementById("hotelArea");

hotel.classList.remove("hidden");

hotel.innerHTML=`

<div class="hotel-gacha">

<div class="hotel-gacha-title">
🏨 ホテルガチャ
</div>

<div style="font-size:13px;color:#777;margin-top:4px">
${area.name}の宿をランダムで1つ選びます
</div>

<div id="hotelName" class="hotel-name">
🎰 抽選中…
</div>

<div id="hotelTags" class="hotel-tags"></div>

<button class="hotel-spin" onclick="spinHotelAgain()">
🎲 もう一回ホテルを引く
</button>

<div id="hotelLink"></div>

</div>
`;

spinHotelAgain();
}

function spinHotelAgain(){

if(!selectedArea)return;

const list=
hotelCandidates[selectedArea.name]||[];

const item=
list[Math.floor(Math.random()*list.length)];

const name=document.getElementById("hotelName");
const tags=document.getElementById("hotelTags");
const link=document.getElementById("hotelLink");

name.textContent="🎰 抽選中…";
tags.innerHTML="";
link.innerHTML="";

setTimeout(()=>{

name.textContent=item.name;

tags.innerHTML=
item.tags.map(t=>
`<span class="hotel-tag">${t}</span>`
).join("");

link.innerHTML=`

<a class="hotel-btn"
href="${selectedArea.url}"
target="_blank"
rel="noopener noreferrer">

🏨 このエリアのホテルを予約する

<small>
楽天トラベルで空室・料金を確認
</small>

</a>
`;

},650);
}

function createMission(place,keyword){

if(keyword){

return{
difficulty:"★★★☆☆",
text:`「${keyword}」をテーマに${place}で写真を1枚撮る！`
};

}

const missions=[

{difficulty:"★★☆☆☆",text:"ご当地グルメを1つ食べる！"},

function retry(type){

const keyword=document.getElementById("keyword");

if(type==="onsen")keyword.value="温泉";
else if(type==="food")keyword.value="グルメ";
else if(type==="view")keyword.value="絶景";
else if(type==="adventure")keyword.value="冒険";
else if(type==="random")keyword.value="";
else if(type==="near")keyword.value="遠出";

startRoulette();
}

function completeMission(){

const card=document.getElementById("resultCard");

card.classList.add("complete");

document.getElementById("resultMission").innerHTML=`

<div style="font-size:25px;margin-bottom:8px">
🎉 CONGRATULATIONS!
</div>

${currentMission}

<br><br>

<strong>
旅の思い出、ゲット！
</strong>
`;
}

async function shareResult(){

const keyword=
document.getElementById("keyword").value.trim();

const place=
selectedArea?
`北海道・${selectedArea.name}`:
selectedPlace;

const text=`

🎡 旅ガチャ結果

${mode==="japan"?"🇯🇵 日本":"🌎 世界"}

📍 ${place}

🎯 今日の旅ミッション

${currentMission}

${keyword?
`🔑 キーワード：${keyword}`:""}

次の旅、運に任せてみない？
`;

if(navigator.share){

try{

await navigator.share({
title:"🎡 旅ガチャ",
text:text
});

}catch(e){}

}else{

try{

await navigator.clipboard.writeText(text);

alert("結果をコピーしました！");

}catch(e){

alert(text);

}
}
}
