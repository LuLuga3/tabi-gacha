<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅ガチャ</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#eef7ff;
  text-align:center;
}
header{
  background:#111827;
  color:white;
  padding:30px 10px;
}
h1{margin:0;font-size:30px}
main{
  background:white;
  margin:30px 16px;
  padding:30px 20px;
  border-radius:20px;
}
select,button{
  width:100%;
  padding:16px;
  margin:10px 0 20px;
  font-size:18px;
  border-radius:12px;
}
button{
  background:#2563eb;
  color:white;
  border:0;
  font-weight:bold;
}
#result{
  display:none;
  margin-top:30px;
  padding:20px;
  background:#f3f4f6;
  border-radius:15px;
}
#place{font-size:32px;font-weight:bold}
</style>
</head>

<body>

<header>
<h1>✈️ 旅ガチャ</h1>
<p>次の旅行先をガチャで決めよう！</p>
</header>

<main>

<h2>旅行条件</h2>

<select id="budget">
<option>〜1万円</option>
<option>1〜3万円</option>
<option>3万円以上</option>
</select>

<select id="days">
<option>日帰り</option>
<option>1泊2日</option>
<option>2泊3日以上</option>
</select>

<button onclick="gacha()">🎰 旅先をガチャる！</button>

<div id="result">
<div id="emoji">🎉</div>
<div id="place"></div>
<p id="text"></p>
</div>

</main>

<script>
function gacha(){

const places=[
["⛩️","京都","神社やお寺を楽しもう！"],
["🐙","大阪","食い倒れ旅行を楽しもう！"],
["🌴","沖縄","海を見ながらのんびり！"],
["🐻","北海道","大自然とグルメを満喫！"],
["♨️","箱根","温泉でゆっくりしよう！"],
["🍜","福岡","ラーメンや屋台を楽しもう！"],
["🏯","金沢","歴史と海鮮を楽しもう！"],
["🌊","鎌倉","海と街歩きを楽しもう！"]
];

let x=places[Math.floor(Math.random()*places.length)];

document.getElementById("emoji").textContent=x[0];
document.getElementById("place").textContent=x[1];
document.getElementById("text").textContent=x[2];
document.getElementById("result").style.display="block";

}
</script>

</body>
</html>
