<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈️ タビコンシェルジュ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,
  "Noto Sans JP","Hiragino Kaku Gothic ProN",
  Meiryo,sans-serif;
  background:linear-gradient(180deg,#f5fbff 0%,#fff7f0 100%);
  color:#222;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px 14px 70px;
}

h1{
  text-align:center;
  font-size:29px;
  margin:8px 0 4px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:18px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.07);
}

.title{
  font-size:20px;
  font-weight:900;
  margin-bottom:12px;
}

.label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin:14px 0 6px;
}

input,select{
  width:100%;
  border:1px solid #ddd;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  background:#fff;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.choice{
  border:1px solid #ddd;
  background:#fff;
  border-radius:15px;
  padding:14px 8px;
  font-size:14px;
  font-weight:bold;
}

.choice.selected{
  color:#fff;
  border-color:transparent;
  background:linear-gradient(135deg,#ff4f81,#ff8b5c);
}

.primary{
  width:100%;
  border:0;
  border-radius:17px;
  padding:17px;
  margin-top:18px;
  font-size:18px;
  font-weight:900;
  color:#fff;
  background:linear-gradient(135deg,#ff477e,#ff8b3d);
  box-shadow:0 7px 18px rgba(0,0,0,.12);
}

.secondary{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px;
  margin-top:10px;
  font-weight:800;
  background:#eee;
}

.small{
  color:#888;
  font-size:12px;
  line-height:1.7;
}

.hero{
  text-align:center;
  padding:12px 0 20px;
}

.hero-place{
  font-size:30px;
  font-weight:900;
  margin:8px 0;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:20px;
  background:#fff0f4;
  color:#e50046;
  font-size:12px;
  font-weight:800;
}

.option{
  border:1px solid #eee;
  border-radius:17px;
  padding:15px;
  margin:10px 0;
  background:#fff;
}

.option.selected{
  border:2px solid #ff477e;
  background:#fff8fa;
}

.option-title{
  font-size:16px;
  font-weight:900;
}

.option-detail{
  font-size:13px;
  color:#777;
  line-height:1.7;
  margin-top:5px;
}

.price{
  color:#e50046;
  font-weight:900;
  margin-top:5px;
}

.hotel-name{
  font-size:20px;
  font-weight:900;
  margin:6px 0;
}

.hotel-meta{
  color:#777;
  font-size:13px;
  line-height:1.7;
}

.restaurant{
  border:1px solid #eee;
  border-radius:17px;
  padding:15px;
  margin:10px 0;
}

.restaurant-name{
  font-weight:900;
  font-size:17px;
}

.airport-step{
  display:flex;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.airport-icon{
  font-size:23px;
}

.airport-info{
  flex:1;
}

.airport-title{
  font-weight:900;
}

.airport-detail{
  font-size:13px;
  color:#777;
  margin-top:3px;
  line-height:1.6;
}

.shiori{
  background:#fafafa;
  border:1px solid #eee;
  border-radius:18px;
  padding:16px;
}

.shiori-day{
  font-weight:900;
  font-size:18px;
  margin:12px 0 8px;
}

.timeline{
  border-left:3px solid #ff6b81;
  padding-left:14px;
  margin-left:6px;
}

.timeline-item{
  margin-bottom:15px;
}

.timeline-time{
  font-size:12px;
  color:#e50046;
  font-weight:900;
}

.timeline-title{
  font-weight:900;
  margin-top:3px;
}

.timeline-detail{
  font-size:12px;
  color:#777;
  line-height:1.6;
}

.back{
  text-align:center;
  color:#777;
  font-size:13px;
  margin:15px 0;
  text-decoration:underline;
  cursor:pointer;
}

.success{
  text-align:center;
  background:#effff5;
  color:#16854a;
  padding:12px;
  border-radius:15px;
  font-weight:bold;
}

@media(max-width:420px){
  h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>✈️ タビコンシェルジュ</h1>
<div class="subtitle">
旅行を決めるのが面倒な人のためのAI旅行サイト
</div>


<!-- =====================================================
     SCREEN 1 条件入力
===================================================== -->

<div id="screen1" class="screen active">

<div class="card">

<div class="title">📝 まず旅行の条件を教えてください</div>

<label class="label">出発地</label>
<input id="departure" placeholder="例：大阪駅、東京都、関西空港">

<label class="label">行きたい場所</label>
<input id="destination" placeholder="例：四国水族館">

<label class="label">旅行日</label>
<input id="travelDate" type="date">

<label class="label">何泊？</label>
<select id="nights">
<option value="0">日帰り</option>
<option value="1">1泊</option>
<option value="2">2泊</option>
<option value="3">3泊</option>
<option value="4">4泊</option>
<option value="5">5泊</option>
</select>

<label class="label">人数</label>
<select id="people">
<option value="1">1名</option>
<option value="2" selected>2名</option>
<option value="3">3名</option>
<option value="4">4名</option>
<option value="5">5名</option>
<option value="6">6名以上</option>
</select>

</div>


<div class="card">

<div class="title">🚃 行き方の希望</div>

<div class="grid">

<button class="choice selected"
onclick="selectTransport(this,'おまかせ')">
🎯 おまかせ
</button>

<button class="choice"
onclick="selectTransport(this,'電車')">
🚄 電車
</button>

<button class="choice"
onclick="selectTransport(this,'飛行機')">
✈️ 飛行機
</button>

<button class="choice"
onclick="selectTransport(this,'車')">
🚗 車
</button>

<button class="choice"
onclick="selectTransport(this,'バス')">
🚌 バス
</button>

</div>

</div>


<div class="card">

<div class="title">🍽️ 夕食の希望</div>

<div class="grid">

<button class="choice"
onclick="selectDinner(this,'肉')">
🥩 肉
</button>

<button class="choice"
onclick="selectDinner(this,'魚')">
🐟 魚
</button>

<button class="choice"
onclick="selectDinner(this,'和食')">
🍱 和食
</button>

<button class="choice"
onclick="selectDinner(this,'洋食')">
🍝 洋食
</button>

<button class="choice"
onclick="selectDinner(this,'おまかせ')">
🎯 おまかせ
</button>

<button class="choice"
onclick="selectDinner(this,'誕生日・記念日')">
🎂 誕生日・記念日
</button>

</div>

</div>


<div class="card">

<div class="title">🏨 ホテル条件</div>

<label class="label">予算</label>

<select id="budget">
<option>おまかせ</option>
<option>1万円以下</option>
<option>1〜2万円</option>
<option>2〜3万円</option>
<option>3万円以上</option>
</select>

<label class="label">キャンセル</label>

<div class="grid">

<button class="choice selected"
onclick="selectCancel(this,'どちらでも')">
どちらでも
</button>

<button class="choice"
onclick="selectCancel(this,'無料キャンセル')">
🆓 無料キャンセル
</button>

</div>

</div>


<button class="primary" onclick="startTrip()">
✨ この条件で旅行を作る
</button>

</div>


<!-- =====================================================
     SCREEN 2 旅行候補
===================================================== -->

<div id="screen2" class="screen">

<div class="card hero">

<div class="badge">✨ AI旅行プラン</div>

<div class="hero-place" id="planDestination">
四国水族館
</div>

<div class="small" id="planSummary">
あなたの条件から旅行プランを作成しました
</div>

</div>


<div class="card">

<div class="title">🚃 行き方を選ぶ</div>

<div id="transportOptions"></div>

</div>


<div class="card">

<div class="title">🏨 ホテル候補</div>

<div id="hotelOptions"></div>

</div>


<div class="card">

<div class="title">🍽️ 夕食候補</div>

<div id="dinnerOptions"></div>

</div>


<button class="primary" onclick="createShiori()">
📖 このプランで旅のしおりを作る
</button>

<div class="back" onclick="changeConditions()">
条件を変更する
</div>

</div>


<!-- =====================================================
     SCREEN 3 旅のしおり
===================================================== -->

<div id="screen3" class="screen">

<div class="card">

<div class="hero">

<div class="badge">📖 MY TRAVEL PLAN</div>

<div class="hero-place" id="shioriDestination">
四国水族館
</div>

<div class="small">
あなた専用の旅行プラン
</div>

</div>

<div id="shioriContent"></div>

</div>


<div class="card">

<div class="title">✈️ 帰りの空港案内</div>

<div class="small">
空港に到着してから「荷物を預けるところ」まで案内します。
</div>

<div id="airportGuide"></div>

</div>


<div class="card">

<div class="title">📱 予約情報</div>

<div class="option">
<div class="option-title">
🏨 <span id="reservationHotel"></span>
</div>

<div class="option-detail">
チェックイン情報をここに表示
</div>
</div>

<div class="option">
<div class="option-title">
✈️ 航空券
</div>

<div class="option-detail">
航空会社・便名・出発時刻などをここに表示
</div>
</div>

</div>


<button class="primary" onclick="downloadShiori()">
📥 旅のしおりを保存
</button>

<button class="secondary" onclick="printShiori()">
🖨️ 印刷・PDF保存
</button>

<div class="back" onclick="backToPlan()">
旅行プランに戻る
</div>

</div>

</div>


<script>

/* =====================================================
   基本データ
===================================================== */

let transport = "おまかせ";
let dinner = "おまかせ";
let cancellation = "どちらでも";

let trip = {
  departure:"",
  destination:"",
  date:"",
  nights:"",
  people:"",
  budget:"",
  transport:"",
  dinner:"",
  cancellation:"",
  selectedTransport:null,
  selectedHotel:null,
  selectedDinner:null
};


/* =====================================================
   条件選択
===================================================== */

function selectTransport(button,value){

transport = value;

document.querySelectorAll(
'#screen1 .choice'
).forEach(btn=>{
  if(
    btn.textContent.includes("おまかせ") ||
    btn.textContent.includes("電車") ||
    btn.textContent.includes("飛行機") ||
    btn.textContent.includes("車") ||
    btn.textContent.includes("バス")
  ){
    btn.classList.remove("selected");
  }
});

button.classList.add("selected");
}


function selectDinner(button,value){

dinner = value;

document.querySelectorAll(
'#screen1 .choice'
).forEach(btn=>{
  if(
    btn.textContent.includes("肉") ||
    btn.textContent.includes("魚") ||
    btn.textContent.includes("和食") ||
    btn.textContent.includes("洋食") ||
    btn.textContent.includes("おまかせ") ||
    btn.textContent.includes("誕生日")
  ){
    btn.classList.remove("selected");
  }
});

button.classList.add("selected");
}


function selectCancel(button,value){

cancellation = value;

document.querySelectorAll(
'#screen1 .choice'
).forEach(btn=>{
  if(
    btn.textContent.includes("どちらでも") ||
    btn.textContent.includes("無料キャンセル")
  ){
    btn.classList.remove("selected");
  }
});

button.classList.add("selected");
}


/* =====================================================
   画面切り替え
===================================================== */

function showScreen(number){

document.querySelectorAll(".screen")
.forEach(screen=>{
  screen.classList.remove("active");
});

document.getElementById(
"screen"+number
).classList.add("active");

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =====================================================
   旅行作成
===================================================== */

function startTrip(){

trip.departure =
document.getElementById("departure").value
|| "大阪";

trip.destination =
document.getElementById("destination").value
|| "四国水族館";

trip.date =
document.getElementById("travelDate").value
|| "未指定";

trip.nights =
document.getElementById("nights").value;

trip.people =
document.getElementById("people").value;

trip.budget =
document.getElementById("budget").value;

trip.transport = transport;
trip.dinner = dinner;
trip.cancellation = cancellation;

document.getElementById(
"planDestination"
).textContent = trip.destination;

document.getElementById(
"planSummary"
).textContent =
trip.departure +
"から" +
trip.destination +
"への旅行プラン";


createTransportOptions();
createHotelOptions();
createDinnerOptions();

showScreen(2);

}


/* =====================================================
   交通候補
===================================================== */

function createTransportOptions(){

const box =
document.getElementById(
"transportOptions"
);

box.innerHTML = "";


/*
 API接続後はここを実際の
 交通検索結果に置き換える
*/

const options = [

{
type:"🚄 新幹線＋電車",
title:"速さ重視",
detail:
trip.departure+
" → 岡山 → 坂出 → "+
trip.destination+
"周辺",
time:"約3時間",
price:"約8,000円〜"
},

{
type:"🚌 高速バス",
title:"安さ重視",
detail:
trip.departure+
" → 香川県方面 → "+
trip.destination,
time:"約4時間30分",
price:"約4,000円〜"
},

{
type:"🚗 車",
title:"自由度重視",
detail:
trip.departure+
" → "+
trip.destination,
time:"約3時間30分",
price:"高速料金・ガソリン代"
}

];


options.forEach((option,index)=>{

const div =
document.createElement("div");

div.className =
"option" +
(index===0 ? " selected":"");

div.onclick = function(){

document.querySelectorAll(
"#transportOptions .option"
).forEach(x=>
x.classList.remove("selected")
);

div.classList.add("selected");

trip.selectedTransport =
option;

};

div.innerHTML =

'<div class="option-title">'+
option.type+
"｜"+
option.title+
'</div>'+

'<div class="option-detail">'+
option.detail+
"<br>"+
"所要時間："+option.time+
"</div>"+

'<div class="price">'+
option.price+
"</div>";

box.appendChild(div);

});

trip.selectedTransport =
options[0];

}


/* =====================================================
   ホテル
===================================================== */

function createHotelOptions(){

const box =
document.getElementById(
"hotelOptions"
);

box.innerHTML = "";


/*
 実際にはホテルAPI・予約サイトAPIから
 取得したデータをここへ入れる
*/

const hotels = [

{
name:"四国水族館周辺ホテル",
distance:"目的地から約10〜20分",
price:"約8,000円〜",
cancel:"無料キャンセル対応プランあり"
},

{
name:"坂出駅周辺ホテル",
distance:"四国水族館から約15分",
price:"約7,000円〜",
cancel:"無料キャンセル対応プランあり"
},

{
name:"高松駅周辺ホテル",
distance:"四国水族館から約40分",
price:"約6,000円〜",
cancel:"無料キャンセル対応プランあり"
}

];


hotels.forEach((hotel,index)=>{

const div =
document.createElement("div");

div.className =
"option"+
(index===0 ? " selected":"");

div.onclick = function(){

document.querySelectorAll(
"#hotelOptions .option"
).forEach(x=>
x.classList.remove("selected")
);

div.classList.add("selected");

trip.selectedHotel =
hotel;

};

div.innerHTML =

'<div class="hotel-name">🏨 '+
hotel.name+
"</div>"+

'<div class="hotel-meta">'+
"📍 "+hotel.distance+
"<br>"+
"🧳 "+hotel.cancel+
"</div>"+

'<div class="price">'+
hotel.price+
"</div>";

box.appendChild(div);

});

trip.selectedHotel =
hotels[0];

}


/* =====================================================
   夕食
===================================================== */

function createDinnerOptions(){

const box =
document.getElementById(
"dinnerOptions"
);

box.innerHTML = "";

let type = trip.dinner;

if(type === "おまかせ"){
type = "地元料理";
}

const restaurants = [

{
name:"四国水族館周辺の"+type+"レストラン",
detail:
trip.destination+
"から徒歩・車でアクセスしやすい店舗",
price:"予算目安 2,000〜5,000円"
},

{
name:"坂出・高松エリアの"+type+"料理",
detail:
"ホテルからアクセスしやすい店舗",
price:"予算目安 2,000〜6,000円"
}

];


restaurants.forEach((restaurant,index)=>{

const div =
document.createElement("div");

div.className =
"restaurant"+
(index===0 ? " selected":"");

div.onclick = function(){

document.querySelectorAll(
"#dinnerOptions .restaurant"
).forEach(x=>
x.classList.remove("selected")
);

div.classList.add("selected");

trip.selectedDinner =
restaurant;

};

div.innerHTML =

'<div class="restaurant-name">'+
"🍽️ "+restaurant.name+
"</div>"+

'<div class="option-detail">'+
restaurant.detail+
"</div>"+

'<div class="price">'+
restaurant.price+
"</div>";

box.appendChild(div);

});

trip.selectedDinner =
restaurants[0];

}


/* =====================================================
   旅のしおり
===================================================== */

function createShiori(){

const hotel =
trip.selectedHotel ||
{
name:"おすすめホテル",
distance:"目的地から約20分"
};

const transportOption =
trip.selectedTransport ||
{
type:"🚄 おすすめ交通",
detail:"目的地までのルート"
};

const dinnerOption =
trip.selectedDinner ||
{
name:"おすすめレストラン",
detail:"ホテル周辺"
};


document.getElementById(
"shioriDestination"
).textContent =
trip.destination;


document.getElementById(
"reservationHotel"
).textContent =
hotel.name;


document.getElementById(
"shioriContent"
).innerHTML =

'<div class="shiori">'+

'<div class="shiori-day">📅 旅行1日目</div>'+

'<div class="timeline">'+

'<div class="timeline-item">'+
'<div class="timeline-time">出発</div>'+
'<div class="timeline-title">🚃 '+
trip.departure+
" 出発"+
"</div>"+
'<div class="timeline-detail">'+
transportOption.type+
"<br>"+
transportOption.detail+
"</div>"+
"</div>"+


'<div class="timeline-item">'+
'<div class="timeline-time">到着</div>'+
'<div class="timeline-title">📍 '+
trip.destination+
" 到着"+
"</div>"+
'<div class="timeline-detail">'+
"行きたい場所として登録した目的地です。"+
"</div>"+
"</div>"+


'<div class="timeline-item">'+
'<div class="timeline-time">ホテル</div>'+
'<div class="timeline-title">🏨 '+
hotel.name+
" チェックイン"+
"</div>"+
'<div class="timeline-detail">'+
"📍 "+hotel.distance+
"</div>"+
"</div>"+


'<div class="timeline-item">'+
'<div class="timeline-time">夕食</div>'+
'<div class="timeline-title">🍽️ '+
dinnerOption.name+
"</div>"+
'<div class="timeline-detail">'+
dinnerOption.detail+
"</div>"+
"</div>"+

"</div>"+

'<div class="shiori-day">✈️ 帰り</div>'+

'<div class="timeline">'+

'<div class="timeline-item">'+
'<div class="timeline-title">🏨 '+
hotel.name+
" 出発"+
"</div>"+
'<div class="timeline-detail">'+
"空港へ向かいます。"+
"</div>"+
"</div>"+

'<div class="timeline-item">'+
'<div class="timeline-title">✈️ 空港到着</div>'+
'<div class="timeline-detail">'+
"第1ターミナル・2階"+
"</div>"+
"</div>"+

'<div class="timeline-item">'+
'<div class="timeline-title">🧳 手荷物を預ける</div>'+
'<div class="timeline-detail">'+
"航空会社カウンターへ移動"+
"</div>"+
"</div>"+

"</div>"+

"</div>";


createAirportGuide();

showScreen(3);

}


/* =====================================================
   空港案内
===================================================== */

function createAirportGuide(){

const box =
document.getElementById(
"airportGuide"
);

box.innerHTML =

'<div class="airport-step">'+
'<div class="airport-icon">🚃</div>'+
'<div class="airport-info">'+

/* =====================================================

===================================================== */

function downloadShiori(){

const text =
document.getElementById(
"shioriContent"
).innerText+
"\n\n"+
"【空港案内】\n"+
document.getElementById(
"airportGuide"
).innerText;

const blob =
new Blob(
[text],
{type:"text/plain;charset=utf-8"}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href = url;

a.download =
"旅のしおり_"+trip.destination+".txt";

a.click();

URL.revokeObjectURL(url);

}
