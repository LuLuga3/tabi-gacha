<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅ルーレット</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
background:linear-gradient(135deg,#eef7ff,#fff4e8);
color:#222;
}

header{
background:#111827;
color:white;
text-align:center;
padding:25px 15px;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:8px 0 0;
}

main{
max-width:600px;
margin:auto;
padding:18px 14px 50px;
}

.card{
background:white;
border-radius:20px;
padding:20px;
margin-bottom:18px;
box-shadow:0 6px 25px rgba(0,0,0,.08);
}

h2{text-align:center;margin-top:0}

.mode{
display:grid;
gap:10px;
}

.mode button{
margin:0;
background:#2563eb;
}

button{
width:100%;
padding:16px;
border:0;
border-radius:14px;
font-size:18px;
font-weight:bold;
color:white;
background:#2563eb;
margin-top:12px;
}

button:active{
transform:scale(.97);
}

select{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
margin-top:6px;
}

label{
font-weight:bold;
display:block;
margin-top:14px;
}

.hidden{
display:none;
}

.wheelArea{
position:relative;
width:310px;
height:310px;
margin:20px auto;
}

.pointer{
position:absolute;
top:-12px;
left:50%;
transform:translateX(-50%);
font-size:42px;
z-index:5;
}

#wheel{
width:300px;
height:300px;
border-radius:50%;
border:8px solid white;
box-shadow:0 6px 20px #0003;
}

.stop{
background:#ef4444;
}

.result{
display:none;
text-align:center;
}

.big{
font-size:55px;
}

.place{
font-size:34px;
font-weight:bold;
}

.alert{
padding:15px;
border-radius:14px;
margin:12px 0;
text-align:left;
line-height:1.6;
}

.safe{
background:#ecfdf5;
}

.caution{
background:#fff7ed;
}

.danger{
background:#fee2e2;
}

.mission{
background:#f3f4f6;
padding:14px;
border-radius:12px;
margin:8px 0;
text-align:left;
}

.info{
background:#f8fafc;
padding:14px;
border-radius:12px;
margin-top:10px;
text-align:left;
line-height:1.6;
}

footer{
text-align:center;
font-size:12px;
color:#777;
padding:20px;
}
</style>
</head>

<body>

<header>
<h1>🌏 旅ルーレット</h1>
<p>次の旅を、運とAIで決めよう。</p>
</header>

<main>

<div class="card">

<h2>✈️ どうやって旅を決める？</h2>

<div class="mode">

<button onclick="showRoulette()">
🎡 運に任せる
</button>

<button onclick="showHot()">
🔥 今行きどきの場所
</button>

<button onclick="showChoose()">
❤️ 行きたい場所を選ぶ
</button>

</div>

</div>


<!-- ルーレット -->

<div class="card hidden" id="rouletteCard">

<h2>🎡 運命の旅先</h2>

<label>エリア</label>

<select id="area">
<option value="all">🌏 日本＋世界</option>
<option value="japan">🗾 日本</option>
<option value="world">🌎 世界</option>
</select>

<div class="wheelArea">
<div class="pointer">▼</div>
<canvas id="wheel" width="300" height="300"></canvas>
</div>

<button onclick="startRoulette()" id="start">
🎡 ルーレットを回す！
</button>

<button onclick="stopRoulette()" id="stop" class="stop" disabled>
🛑 STOP！
</button>

</div>


<!-- 今行きどき -->

<div class="card hidden" id="hotCard">

<h2>🔥 今行きどき</h2>

<p>
季節や旅行のしやすさなどから、
おすすめの旅先を選びます。
</p>

<button onclick="chooseHot('台湾')">
🇹🇼 台湾
</button>

<button onclick="chooseHot('韓国')">
🇰🇷 韓国
</button>

<button onclick="chooseHot('イタリア')">
🇮🇹 イタリア
</button>

<button onclick="chooseHot('沖縄')">
🌴 沖縄
</button>

</div>


<!-- 場所を選ぶ -->

<div class="card hidden" id="chooseCard">

<h2>❤️ 行きたい場所</h2>

<label>行き先</label>

<select id="directPlace">

<option>京都</option>
<option>大阪</option>
<option>北海道</option>
<option>沖縄</option>
<option>東京</option>
<option>福岡</option>
<option>台湾</option>
<option>韓国</option>
<option>タイ</option>
<option>イタリア</option>
<option>フランス</option>
<option>アメリカ</option>

</select>

<button onclick="chooseDirect()">
🎯 この場所で旅を作る
</button>

</div>


<!-- 結果 -->

<div class="card result" id="result">

<div class="big" id="emoji">🎉</div>

<div class="place" id="place"></div>

<p id="catch"></p>

<div id="safety"></div>

<h2>🎯 今回のミッション</h2>

<div class="mission">
☐ <span id="m1"></span>
</div>

<div class="mission">
☐ <span id="m2"></span>
</div>

<div class="mission">
☐ <span id="m3"></span>
</div>

<div class="info">
<strong>🍴 ご当地グルメ</strong>
<br>
<span id="food"></span>
</div>

<div class="info">
<strong>💰 予算目安</strong>
<br>
<span id="price"></span>
</div>

<button onclick="searchHotel()">
🏨 ホテルを探す
</button>

<button onclick="searchTransport()">
🚆 交通を調べる
</button>

<button onclick="shareResult()">
📱 友達にシェア
</button>

<button onclick="location.reload()">
🔄 もう一度
</button>

</div>

</main>

<footer>
旅ルーレット © 2026
</footer>


<script>

const places=[

{
name:"北海道",
emoji:"🐻",
area:"japan",
catch:"大自然と美味しいものを楽しむ旅。",
food:"海鮮丼・味噌ラーメン・ジンギスカン",
price:"3万円以上",
safety:"safe",
missions:[
"北海道限定グルメを食べる",
"自然の中で写真を撮る",
"地元のお土産を1つ買う"
]
},

{
name:"東京",
emoji:"🗼",
area:"japan",
catch:"何度行っても新しい発見がある街。",
food:"寿司・ラーメン・もんじゃ",
price:"1〜3万円",
safety:"safe",
missions:[
"行ったことのない駅で降りる",
"気になる店に入る",
"東京らしい写真を撮る"
]
},

{
name:"京都",
emoji:"⛩️",
area:"japan",
catch:"今日は京都で非日常。",
food:"抹茶・湯葉・京都ラーメン",
price:"1〜3万円",
safety:"safe",
missions:[
"神社を1つ巡る",
"抹茶スイーツを食べる",
"京都らしい写真を3枚撮る"
]
},

{
name:"大阪",
emoji:"🐙",
area:"japan",
catch:"今日は食い倒れ。",
food:"たこ焼き・お好み焼き・串カツ",
price:"1〜3万円",
safety:"safe",
missions:[
"たこ焼きを食べる",
"知らない商店街を歩く",
"大阪らしい写真を撮る"
]
},

{
name:"沖縄",
emoji:"🌴",
area:"japan",
catch:"海と南国グルメを楽しむ旅。",
food:"沖縄そば・タコライス",
price:"3万円以上",
safety:"safe",
missions:[
"海を見る",
"沖縄料理を食べる",
"夕日を写真に撮る"
]
},

{
name:"福岡",
emoji:"🍜",
area:"japan",
catch:"美味しいものを食べる旅。",
food:"豚骨ラーメン・もつ鍋",
price:"1〜3万円",
safety:"safe",
missions:[
"屋台に行く",
"豚骨ラーメンを食べる",
"知らない店に入る"
]
},

{
name:"台湾",
emoji:"🇹🇼",
area:"world",
catch:"食べ歩きと街歩きを楽しむ旅。",
food:"小籠包・夜市グルメ",
price:"3〜6万円",
safety:"safe",
missions:[
"夜市に行く",
"小籠包を食べる",
"現地のお店で買い物する"
]
},

{
name:"韓国",
emoji:"🇰🇷",
area:"world",
catch:"グルメとショッピングを楽しむ旅。",
food:"韓国料理・スイーツ",
price:"3〜6万円",
safety:"safe",
missions:[
"現地の市場へ行く",
"韓国料理を食べる",
"日本にない商品を探す"
]
},

{
name:"タイ",
emoji:"🇹🇭",
area:"world",
catch:"南国の街とグルメを楽しむ旅。",
food:"タイ料理・マンゴースイーツ",
price:"5〜10万円",
safety:"caution",
missions:[
"屋台グルメを食べる",
"寺院を訪れる",
"現地の市場を歩く"
]
},

{
name:"イタリア",
emoji:"🇮🇹",
area:"world",
catch:"本場の料理と歴史を楽しむ旅。",
food:"ピザ・パスタ・ジェラート",
price:"10万円以上",
safety:"safe",
missions:[
"本場のピザを食べる",
"歴史的な場所を見る",
"ジェラートを食べる"
]
},

{
name:"フランス",
emoji:"🇫🇷",
area:"world",
catch:"街並みと美食を楽しむ旅。",
food:"クロワッサン・チーズ・フレンチ",
price:"10万円以上",
safety:"caution",
missions:[
"本場のパンを食べる",
"有名スポットを見る",
"現地のスーパーに入る"
]
},

{
name:"アメリカ",
emoji:"🇺🇸",
area:"world",
catch:"スケールの大きな旅へ。",
food:"ハンバーガー・ステーキ",
price:"10万円以上",
safety:"caution",
missions:[
"現地の人気店へ行く",
"大きな観光スポットを見る",
"現地限定商品を探す"
]
}

];


let candidates=[];
let spinning=false;
let angle=0;
let animation;
let current=null;


const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");


function hideAll(){

document.getElementById("rouletteCard").classList.add("hidden");
document.getElementById("hotCard").classList.add("hidden");
document.getElementById("chooseCard").classList.add("hidden");

}


function showRoulette(){

hideAll();

document.getElementById("rouletteCard")
.classList.remove("hidden");

setCandidates();

}


function showHot(){

hideAll();

document.getElementById("hotCard")
.classList.remove("hidden");

}


function showChoose(){

hideAll();

document.getElementById("chooseCard")
.classList.remove("hidden");

}


function setCandidates(){

const area=document.getElementById("area").value;

if(area==="all"){

candidates=[...places];

}else{

candidates=places.filter(
p=>p.area===area
);

}

drawWheel();

}


document.getElementById("area").onchange=setCandidates;


function drawWheel(){

ctx.clearRect(0,0,300,300);

const center=150;
const radius=142;
const slice=Math.PI*2/candidates.length;

const colors=[
"#60a5fa",
"#fbbf24",
"#f87171",
"#34d399",
"#a78bfa",
"#fb923c",
"#38bdf8",
"#f472b6"
];

candidates.forEach((p,i)=>{

const start=i*slice;
const end=start+slice;

ctx.beginPath();

ctx.moveTo(center,center);

ctx.arc(
center,
center,
radius,
start,
end
);

ctx.closePath();

ctx.fillStyle=colors[i%colors.length];

ctx.fill();

ctx.save();

ctx.translate(center,center);

ctx.rotate(start+slice/2);

ctx.fillStyle="white";

ctx.font="bold 13px sans-serif";

ctx.textAlign="right";

ctx.fillText(
p.name,
radius-10,
5
);

ctx.restore();

});

}


function startRoulette(){

if(spinning)return;

setCandidates();

spinning=true;

document.getElementById("start").disabled=true;
document.getElementById("stop").disabled=false;

let speed=.35;

function rotate(){

if(!spinning)return;

angle+=speed;

canvas.style.transform=
"rotate("+angle+"rad)";

animation=requestAnimationFrame(rotate);

}

rotate();

}


function stopRoulette(){

if(!spinning)return;

spinning=false;

cancelAnimationFrame(animation);

document.getElementById("stop").disabled=true;

let speed=.3;

function slow(){

angle+=speed;

canvas.style.transform=
"rotate("+angle+"rad)";

speed*=.94;

if(speed>.01){

requestAnimationFrame(slow);

}else{

finishRoulette();

}

}

slow();

}


function finishRoulette(){

const slice=Math.PI*2/candidates.length;

let normalized=
((-angle%(Math.PI*2))+Math.PI*2)
%(Math.PI*2);

let index=
Math.floor(normalized/slice);

current=candidates[index];

showResult();

document.getElementById("start").disabled=false;

}


function chooseHot(name){

const found=places.find(p=>p.name===name);

current=found;

showResult();

}


function chooseDirect(){

const name=
document.getElementById("directPlace").value;

const found=places.find(p=>p.name===name);

current=found;

showResult();

}


function showResult(){

if(!current)return;

document.getElementById("emoji").textContent=
current.emoji;

document.getElementById("place").textContent=
current.name;

document.getElementById("catch").textContent=
current.catch;

document.getElementById("m1").textContent=
current.missions[0];

document.getElementById("m2").textContent=
current.missions[1];

document.getElementById("m3").textContent=
current.missions[2];

document.getElementById("food").textContent=
current.food;

document.getElementById("price").textContent=
current.price;


let safety="";

if(current.safety==="safe"){

safety=`
<div class="alert safe">
🟢 <strong>比較的安心して計画しやすい地域</strong><br>
ただし、旅行前には最新の公式安全情報を確認してください。
</div>
`;

}

if(current.safety==="caution"){

safety=`
<div class="alert caution">
⚠️ <strong>旅行前に最新情報を確認</strong><br>
地域や情勢によって注意が必要な場合があります。
最新の公式安全情報を確認してから旅行を計画してください。
</div>
`;

}

document.getElementById("safety").innerHTML=safety;

document.getElementById("result").style.display="block";

document.getElementById("result")
.scrollIntoView({
behavior:"smooth"
});

}


function searchHotel(){

if(!current)return;

window.open(
"https://www.google.com/search?q="+
encodeURIComponent(current.name+" ホテル"),
"_blank"
);

}


function searchTransport(){

if(!current)return;

window.open(
"https://www.google.com/search?q="+
encodeURIComponent(current.name+" 行き方"),
"_blank"
);

}


function shareResult(){

if(!current)return;

const text=
"🌏 旅ルーレットで「"+
current.name+
"」に決まった！";

if(navigator.share){

navigator.share({
title:"旅ルーレット",
text:text,
url:location.href
});

}else{

alert(text);

}

}

</script>

</body>
</html>
