    }

    }

    }

      opacity: 0.8;
    }

      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 17px;
      margin-top: 24px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #2563eb;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #result {
      display: none;
      text-align: center;
    }

    .emoji {
      font-size: 64px;
      margin: 10px 0;
    }

    .destination {
      font-size: 30px;
      font-weight: bold;
      margin: 10px 0;
    }

    .reason {

    }

    .price {

    }

    .again {
      background: #111827;
    }

    footer {

      color: #777;
      font-size: 13px;
      padding: 20px;
    }
  </style>
</head>
