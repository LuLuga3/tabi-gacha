<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅ガチャ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
  background: #f5f7fb;
  color: #20242a;
}

header {
  background: #111827;
  color: white;
  padding: 24px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
  opacity: .8;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 7px;
}

select {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  background: white;
}

button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 16px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.main-button {
  background: #111827;
  color: white;
  margin-top: 22px;
}

.main-button:active {
  transform: scale(.98);
}

.result {
  display: none;
}

.destination {
  text-align: center;
  padding: 10px;
}

.destination .emoji {
  font-size: 55px;
}

.destination h2 {
  font-size: 34px;
  margin: 5px 0;
}

.tag {
  display: inline-block;
  background: #eef2ff;
  padding: 7px 12px;
  border-radius: 20px;
  margin: 4px;
  font-size: 13px;
}

.mission {
  padding: 14px;
  border-bottom: 1px solid #eee;
}

.mission:last-child {
  border-bottom: none;
}

.mission input {
  width: 20px;
  height: 20px;
  vertical-align: middle;
  margin-right: 10px;
}

.price {
  font-size: 25px;
  font-weight: bold;
  text-align: center;
  margin: 15px 0;
}

.link-button {
  display: block;
  text-align: center;
  text-decoration: none;
  background: #f1f5f9;
  color: #111827;
  padding: 14px;
  border-radius: 12px;
  margin-top: 10px;
  font-weight: bold;
}

.small {
  color: #6b7280;
  font-size: 13px;
  line-height: 1.6;
}

footer {
  text-align: center;
  color: #888;
  padding: 30px 10px;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h1>🎲 旅ガチャ</h1>
  <p>次の旅は、自分で決めない。</p>
</header>

<div class="container">

  <div class="card">
    <h2>🎯 あ
