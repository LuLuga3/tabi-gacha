<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅ルーレット</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
background:linear-gradient(135deg,#eef7ff,#fff5e9);
color:#20242a;
}

header{
background:#111827;
color:white;
text-align:center;
padding:25px 15px;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:8px 0 0;
opacity:.85;
}

main{
max-width:650px;
margin:auto;
padding:16px 14px 60px;
}

.card{
background:white;
border-radius:20px;
padding:20px;
margin-bottom:18px;
box-shadow:0 6px 25px rgba(0,0,0,.08);
}

h2{
text-align:center;
margin-top:0;
}

h3{
margin-bottom:8px;
}

label{
display:block;
font-weight:bold;
margin:14px 0 7px;
}

input,select{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
background:white;
}

button{
width:100%;
padding:16px;
border:0;
border-radius:14px;
font-size:18px;
font-weight:bold;
color:white;
background:#2563eb;
margin-top:12px;
}

button:active{
transform:scale(.97);
}

button:disabled{
background:#aaa;
}

.stop{
background:#ef4444;
}

.dark{
background:#111827;
}

.green{
background:#16a34a;
}

.orange{
background:#f97316;
}

.modeGrid{
display:grid;
gap:10px;
}

.smallGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.smallGrid button{
margin-top:0;
}

.hidden{
display:none;
}

.hint{
font-size:13px;
color:#777;
margin-top:6px;
line-height:1.5;
}

/* wheel */

.wheelArea{
position:relative;
width:310px;
height:310px;
margin:20px auto;
}

.pointer{
position:absolute;
z-index:5;
top:-15px;
left:50%;
transform:translateX(-50%);
font-size:45px;
}

#wheel{
width:300px;
height:300px;
border-radius:50%;
border:8px solid white;
box-shadow:0 8px 25px rgba(0,0,0,.2);
}

/* result */

.result{
display:none;
text-align:center;
}

.resultEmoji{
font-size:65px;
}

.destination{
font-size:36px;
font-weight:bold;
}

.catch{
color:#555;
line-height:1.7;
}

.info{
background:#f8fafc;
border-radius:14px;
padding:15px;
margin-top:12px;
text-align:left;
line-height:1.7;
}

.safe{
background:#ecfdf5;
}

.warning{
background:#fff1f2;
border:2px solid #f87171;
}

.special{
background:#fff8dc;
border:2px solid #f5c542;
border-radius:15px;
padding:16px;
margin-top:15px;
text-align:left;
line-height:1.7;
}

.mission{
background:#f3f4f6;
border-radius:13px;
padding:14px;
margin:9px 0;
text-align:left;
line-height:1.6;
}

.mission input{
width:auto;
margin-right:8px;
}

.tag{
display:inline-block;
padding:4px 9px;
border-radius:20px;
background:#e0f2fe;
color:#0369a1;
font-size:12px;
margin:2px;
}

.count{
text-align:center;
font-size:13px;
color:#777;
margin-top:10px;
}

footer{
text-align:center;
font-size:12px;
color:#777;
padding:20px;
}
</style>
</head>

<body>

<header>
<h1>🎡 旅ルーレット</h1>
<p>行き先も、旅の内容も、運に任せよう。</p>
</header>

<main>

<!-- STEP 1 -->

<div class="card">

<h2>🎯 旅の目的</h2>

<input
id="keyword"
placeholder="例：ちいかわ、ラーメン、温泉、推し活、絶景">

<div class="hint">
好きなもの・やりたいことを自由に入力できます。
空欄でもOK。
</div>

</div>


<!-- STEP 2 -->

<div class="card">

<h2>📅 旅の条件</h2>

<label>旅行する日</label>

<input
type="date"
id="travelDate">

<div class="hint">
旅行が近づくほど、天気などを重視する設計です。
</div>


<label>旅行日数</label>

<select id="days">
<option value="1">日帰り</option>
<option value="2">1泊2日</option>
<option value="3">2泊3日</option>
<option value="4">3泊4日</option>
<option value="7">1週間</option>
</select>


<label>1人あたり予算</label>

<select id="budget">
<option value="10000">〜1万円</option>
<option value="30000">〜3万円</option>
<option value="50000">〜5万円</option>
<option value="100000">〜10万円</option>
<option value="200000">〜20万円</option>
<option value="9999999">20万円以上</option>
</select>


<label>ミッション数</label>

<select id="missionCount">
<option value="1">1個</option>
<option value="3" selected>3個</option>
<option value="5">5個</option>
<option value="10">10個</option>
</select>


<label>ミッション難易度</label>

<select id="difficulty">
<option value="easy">😊 EASY</option>
<option value="normal" selected>😎 NORMAL</option>
<option value="hard">🔥 HARD</option>
</select>

</div>


<!-- STEP 3 -->

<div class="card">

<h2>🌏 旅の範囲</h2>

<label>日本？世界？</label>

<select id="area">
<option value="all">🌏 日本＋世界</option>
<option value="japan">🗾 日本</option>
<option value="world">🌎 世界</option>
</select>


<label>地域で絞る</label>

<select id="region">
<option value="all">すべて</option>
</select>

<div class="hint">
「日本＋世界」でも地域を絞ってルーレットできます。
</div>

</div>


<!-- ルーレットモード -->

<div class="card">

<h2>🎰 どうやって決める？</h2>

<div class="modeGrid">

<button onclick="showDestinationRoulette()">
🎡 行き先だけルーレット
</button>

<button class="orange" onclick="startAllRoulette()">
🎰 全部ルーレット
</button>

</div>

<button class="dark" onclick="showDirectChoice()">
❤️ 行きたい場所を自分で選ぶ
</button>

</div>


<!-- 行き先ルーレット -->

<div class="card hidden" id="rouletteCard">

<h2>🎡 行き先ルーレット</h2>

<div class="wheelArea">
<div class="pointer">▼</div>
<canvas id="wheel" width="300" height="300"></canvas>
</div>

<button
id="startButton"
onclick="startRoulette()">
🎡 回す！
</button>

<button
id="stopButton"
class="stop"
onclick="stopRoulette()"
disabled>
🛑 STOP！
</button>

<div class="count" id="candidateCount"></div>

</div>


<!-- 全部ルーレット -->

<div class="card hidden" id="allRouletteCard">

<h2>🎰 全部ルーレット</h2>

<p>
ここから旅の条件をもとに、
順番にルーレットで決めていきます。
</p>

<div id="allStep"></div>

</div>


<!-- 直接選択 -->

<div class="card hidden" id="directCard">

<h2>❤️ 行きたい場所</h2>

<label>場所</label>

<select id="directPlace"></select>

<button onclick="chooseDirect()">
🎯 この場所にする
</button>

</div>


<!-- 結果 -->

<div class="card result" id="result">

<div class="resultEmoji" id="resultEmoji">🎉</div>

<div class="destination" id="destination"></div>

<p class="catch" id="catch"></p>

<div id="weatherBox"></div>

<div id="safety"></div>

<h2>🎯 あなた専用ミッション</h2>

<div id="missions"></div>

<div class="special" id="special"></div>

<div class="info">
<strong>🍴 ご当地グルメ</strong>
<br>
<span id="food"></span>
</div>

<div class="info">
<strong>💰 予算目安</strong>
<br>
<span id="price"></span>
</div>


<button class="dark" onclick="searchHotel()">
🏨 ホテルを探す
</button>

<button class="dark" onclick="searchTransport()">
🚆 交通を調べる
</button>

<button class="green" onclick="shareResult()">
📱 友達にシェア
</button>

<button onclick="location.reload()">
🔄 もう一度！
</button>

</div>

</main>

<footer>
旅ルーレット © 2026
</footer>


<script>

/* =====================================

===================================== */

const japanPlaces=[

["北海道","北海道","🐻","海鮮・自然・温泉"],
["青森県","東北","🍎","りんご・ねぶた・温泉"],
["岩手県","東北","🗿","わんこそば・自然"],

["秋田県","東北","🐕","きりたんぽ・温泉"],
["山形県","東北","🍒","さくらんぼ・温泉"],
["福島県","東北","🍑","桃・会津・温泉"],

["神奈川県","関東","🌊","横浜・鎌倉・箱根"],

["大阪府","近畿","🐙","たこ焼き・街歩き"],
["兵庫県","近畿","🥩","神戸・温泉・淡路島"],
["奈良県","近畿","🦌","鹿・寺社"],
["和歌山県","近畿","🐼","温泉・海・熊野"],

["鳥取県","中国","🏜️","砂丘・海鮮"],
["島根県","⛩️","⛩️","出雲・温泉"],
["岡山県","🍑","🍑","倉敷・桃"],
["広島県","🦪","🦪","宮島・お好み焼き"],
["山口県","🐡","🐡","ふぐ・温泉"],

["徳島県","四国","💃","阿波踊り・海"],
["香川県","四国","🍜","讃岐うどん"],
["愛媛県","🍊","🍊","道後温泉・みかん"],
["高知県","🐟","🐟","カツオ・自然"],

["福岡県","九州","🍜","豚骨ラーメン・屋台"],
["佐賀県","🏺","🏺","陶器・温泉"],
["長崎県","⛪","⛪","夜景・ちゃんぽん"],
["熊本県","🐻","🐻","熊本城・阿蘇"],
["大分県","♨️","♨️","別府・湯布院"],
["宮崎県","🥭","🥭","南国・チキン南蛮"],
["鹿児島県","🌋","🌋","桜島・黒豚"],
["沖縄県","🌴","🌴","海・沖縄料理"]

/* =====================================
   世界
===================================== */

const worldPlaces=[

["韓国","アジア","🇰🇷","韓国料理・カフェ・ショッピング"],
["台湾","アジア","🇹🇼","夜市・小籠包・街歩き"],
["タイ","アジア","🇹🇭","屋台・寺院・南国"],
["ベトナム","アジア","🇻🇳","フォー・市場・街歩き"],
["シンガポール","アジア","🇸🇬","グルメ・夜景"],
["マレーシア","アジア","🇲🇾","多文化・グルメ"],
["インドネシア","アジア","🇮🇩","ビーチ・寺院"],
["フィリピン","アジア","🇵🇭","海・リゾート"],

["フランス","ヨーロッパ","🇫🇷","パン・美術館・街並み"],
["イタリア","ヨーロッパ","🇮🇹","ピザ・歴史・美術"],
["スペイン","ヨーロッパ","🇪🇸","料理・建築・街歩き"],
["イギリス","ヨーロッパ","🇬🇧","紅茶・歴史・街並み"],
["ドイツ","ヨーロッパ","🇩🇪","街並み・料理・城"],
["オーストリア","ヨーロッパ","🇦🇹","音楽・街並み"],
["スイス","ヨーロッパ","🇨🇭","山・鉄道・絶景"],
["ポルトガル","ヨーロッパ","🇵🇹","街並み・海・料理"],
["ギリシャ","ヨーロッパ","🇬🇷","島・遺跡・海"],

["アメリカ","北米","🇺🇸","都市・自然・エンタメ"],
["カナダ","北米","🇨🇦","自然・街・絶景"],
["メキシコ","中南米","🇲🇽","料理・遺跡・街歩き"],

["オーストラリア","オセアニア","🇦🇺","海・自然・動物"],
["ニュージーランド","オセアニア","🇳🇿","自然・絶景・アクティビティ"],

["ブラジル","中南米","🇧🇷","文化・料理・街歩き"],
["チリ","中南米","🇨🇱","自然・星空・絶景"],

["モロッコ","アフリカ","🇲🇦","市場・料理・街並み"],
["南アフリカ","アフリカ","🇿🇦","自然・動物・ワイン"]

];


/* =====================================
   データ変換
===================================== */

function convert(arr,type){

return arr.map(x=>({

name:x[0],
region:x[1],
emoji:x[2],
food:x[3],
type:type,

catch:
x[0]+"で、普段とは違う旅を楽しもう。",

price:
type==="japan"?
"1〜5万円程度":
"5万円以上",

safety:
[
"日本",
"韓国",
"台湾",
"シンガポール",
"オーストラリア",
"ニュージーランド"
].includes(x[0])
?"safe":
"check"

}));

}

const places=[
...convert(japanPlaces,"japan"),
...convert(worldPlaces,"world")
];


/* =====================================
   状態
===================================== */

let candidates=[];
let current=null;

let spinning=false;
let angle=0;
let animation;


/* =====================================
   DOM
===================================== */

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");


/* =====================================
   地域選択
===================================== */

function updateRegions(){

const area=
document.getElementById("area").value;

const select=
document.getElementById("region");

select.innerHTML=
'<option value="all">すべて</option>';


let regions=[];

if(area==="japan"||area==="all"){

regions.push(
"北海道","東北","関東","中部","近畿","中国","四国","九州"
);

}

if(area==="world"||area==="all"){

regions.push(
"アジア",
"ヨーロッパ",
"北米",
"中南米",
"オセアニア",
"アフリカ"
);

}

regions.forEach(r=>{

const option=
document.createElement("option");

option.value=r;
option.textContent=r;

select.appendChild(option);

});

setCandidates();

}


function setCandidates(){

const area=
document.getElementById("area").value;

const region=
document.getElementById("region").value;


candidates=
places.filter(p=>{

let areaOK=
area==="all"||p.type===area;

let regionOK=
region==="all"||p.region===region;

return areaOK&&regionOK;

});


document.getElementById(
"candidateCount"
).textContent=
"候補："+candidates.length+"か所";

drawWheel();

}


document.getElementById("area")
.addEventListener("change",updateRegions);

document.getElementById("region")
.addEventListener("change",setCandidates);


/* =====================================
   ルーレット描画
===================================== */

function drawWheel(){

ctx.clearRect(0,0,300,300);

if(!candidates.length)return;

const center=150;
const radius=142;

const slice=
Math.PI*2/candidates.length;

const colors=[
"#60a5fa",
"#fbbf24",
"#f87171",
"#34d399",
"#a78bfa",
"#fb923c",
"#38bdf8",
"#f472b6"
];

candidates.forEach((p,i)=>{

const start=i*slice;
const end=start+slice;

ctx.beginPath();

ctx.moveTo(center,center);

ctx.arc(
center,
center,
radius,
start,
end
);

ctx.closePath();

ctx.fillStyle=
colors[i%colors.length];

ctx.fill();

ctx.save();

ctx.translate(center,center);

ctx.rotate(start+slice/2);

ctx.fillStyle="white";

ctx.font=
candidates.length>20?
"bold 9px sans-serif":
"bold 12px sans-serif";

ctx.textAlign="right";

ctx.fillText(
p.name,
radius-8,
4
);

ctx.restore();

});

}


/* =====================================
   行き先ルーレット
===================================== */

function showDestinationRoulette(){

hideAll();

document.getElementById(
"rouletteCard"
).classList.remove("hidden");

setCandidates();

}


function startRoulette(){

if(spinning)return;

setCandidates();

spinning=true;

document.getElementById(
"startButton"
).disabled=true;

document.getElementById(
"stopButton"
).disabled=false;


function rotate(){

if(!spinning)return;

angle+=.32;

canvas.style.transform=
"rotate("+angle+"rad)";

animation=
requestAnimationFrame(rotate);

}

rotate();

}


function stopRoulette(){

if(!spinning)return;

spinning=false;

cancelAnimationFrame(animation);

document.getElementById(
"stopButton"
).disabled=true;


let speed=.30;

function slow(){

angle+=speed;

canvas.style.transform=
"rotate("+angle+"rad)";

speed*=.94;

if(speed>.01){

requestAnimationFrame(slow);

}else{

finishRoulette();

}

}

slow();

}


function finishRoulette(){

const slice=
Math.PI*2/candidates.length;

let normalized=
((-angle%(Math.PI*2))+
Math.PI*2)
%(Math.PI*2);

let index=
Math.floor(normalized/slice);

current=
candidates[index];

showResult();

document.getElementById(
"startButton"
).disabled=false;

}


/* =====================================
   全部ルーレット
===================================== */

function startAllRoulette(){

hideAll();

document.getElementById(
"allRouletteCard"
).classList.remove("hidden");

runAllStep();

}


function runAllStep(){

const box=
document.getElementById("allStep");

box.innerHTML=`

<h3>STEP 1 🎡 行き先</h3>

<p>まずは旅先を決めます。</p>

<button onclick="allDestination()">
🎡 行き先ルーレット
</button>

`;

}


function allDestination(){

setCandidates();

if(!candidates.length)return;

current=
candidates[
Math.floor(Math.random()*candidates.length)
];

const box=
document.getElementById("allStep");

box.innerHTML=`

<h3>STEP 1 🎡 行き先</h3>

<div class="info">

${current.emoji}
<strong>${current.name}</strong>

<br>

${current.catch}

</div>

<h3>STEP 2 🏨 ホテル</h3>

<p>
予算：${Number(
document.getElementById("budget").value
).toLocaleString()}円
</p>

<button onclick="hotelRoulette()">
🎰 ホテルをルーレット
</button>

`;

}


function hotelRoulette(){

const hotels=[
"駅近ホテル",
"温泉旅館",
"人気ビジネスホテル",
"デザインホテル",
"隠れ家的ホテル"
];

const selected=
hotels[
Math.floor(Math.random()*hotels.length)
];

document.getElementById(
"allStep"
).innerHTML+=`

<div class="info">

🏨 <strong>${selected}</strong>

<br>

予算条件に合わせて候補を探すホテルタイプ

</div>

<h3>STEP 3 🚆 交通</h3>

<button onclick="transportRoulette()">
🎰 交通手段をルーレット
</button>

`;

}


function transportRoulette(){

const transports=[
"🚄 新幹線",
"✈️ 飛行機",
"🚌 高速バス",
"🚃 電車",
"🚗 レンタカー"
];

const selected=
transports[
Math.floor(Math.random()*transports.length)
];

document.getElementById(
"allStep"
).innerHTML+=`

<div class="info">

🚆 <strong>${selected}</strong>

</div>

<h3>STEP 4 🍴 食事</h3>

<button onclick="foodRoulette()">
🎰 ご当地グルメをルーレット
</button>

`;

}


function foodRoulette(){

const foods=
current.food.split("・");

const selected=
foods[
Math.floor(Math.random()*foods.length)
];

document.getElementById(
"allStep"
).innerHTML+=`

<div class="info">

🍴 <strong>${selected}</strong>

</div>

<h3>STEP 5 🎯 ミッション</h3>

<button class="green" onclick="showResult()">
🎯 最終ミッションを見る
</button>

`;

}


/* =====================================
   直接選択
===================================== */

function showDirectChoice(){

hideAll();

document.getElementById(
"directCard"
).classList.remove("hidden");

const select=
document.getElementById("directPlace");

select.innerHTML="";

places.forEach(p=>{

const option=
document.createElement("option");

option.value=p.name;

option.textContent=
p.emoji+" "+p.name;

select.appendChild(option);

});

}


function chooseDirect(){

const name=
document.getElementById(
"directPlace"
).value;

current=
places.find(p=>p.name===name);

showResult();

}


/* =====================================
   ミッション生成
===================================== */

function makeMissions(){

const keyword=
document.getElementById(
"keyword"
).value.trim();

const count=
Number(
document.getElementById(
"missionCount"
).value
);

const difficulty=
document.getElementById(
"difficulty"
).value;

let missions=[];


if(keyword){

missions.push(
current.name+
"で「"+
keyword+
"」に関係する場所を1つ探す"
);

missions.push(
current.name+
"で「"+
keyword+
"」に関する写真を撮る"
);

missions.push(
"旅先で「"+
keyword+
"」を感じられるものを1つ発見する"
);

}


missions.push(
current.name+
"のご当地グルメを1つ食べる"
);

missions.push(
current.name+
"で行ったことのない場所を1つ訪れる"
);

missions.push(
"現地のお土産を1つ探す"
);

missions.push(
"旅先で地元らしい写真を3枚撮る"
);

missions.push(
"その土地ならではの体験を1つする"
);

if(difficulty==="hard"){

missions.push(
"地元の人におすすめを1つ聞いてみる"
);

missions.push(
"ガイドブックに載っていない場所を1つ探す"
);

}


return missions.slice(0,count);

}


/* =====================================
   結果表示
===================================== */

function showResult(){

if(!current)return;

document.getElementById(
"resultEmoji"
).textContent=
current.emoji;

document.getElementById(
"destination"
).textContent=
current.name;

document.getElementById(
"catch"
).textContent=
current.catch;


/* ミッション */

const missions=
makeMissions();

const box=
document.getElementById("missions");

box.innerHTML="";

missions.forEach((m,i)=>{

box.innerHTML+=`

<div class="mission">

<label style="display:inline">

<input type="checkbox">

${m}

</label>

</div>

`;

});


/* グルメ */

document.getElementById(
"food"
).textContent=
current.food;


/* 予算 */

document.getElementById(
"price"
).textContent=
current.price;


/* 安全 */

if(current.safety==="safe"){

document.getElementById(
"safety"
).innerHTML=`

<div class="info safe">

🟢 <strong>比較的旅行計画を立てやすい地域</strong>

<br>

旅行前には最新の公式安全情報を確認してください。

</div>

`;

}else{

document.getElementById(
"safety"
).innerHTML=`

<div class="warning">

⚠️ <strong>最新の安全情報を確認してください</strong>

<br>

国や地域によって状況が異なります。
実際の旅行前に公式情報を確認してください。

</div>

`;

}


/* 天気 */

const date=
document.getElementById(
"travelDate"
).value;

let weatherText=
"旅行日が近づいたら、最新の天気を確認してミッションを調整します。";

if(date){

const target=
new Date(date);

const today=
new Date();

const diff=
Math.ceil(
(target-today)/86400000
);

if(diff>=0&&diff<=7){

weatherText=
"🌦️ 旅行日が近いため、天気を重視してミッションを調整する予定です。";

}

}

document.getElementById(
"weatherBox"
).innerHTML=`

<div class="info">

<strong>🌦️ 天気連動</strong>

<br>

${weatherText}

</div>

`;


/* 最新情報 */

document.getElementById(
"special"
).innerHTML=`

<h3>🔥 今しかできない旅情報</h3>

<span class="tag">期間限定</span>
<span class="tag">予約確認</span>

<p>

${current.name}で、
あなたの目的「
${document.getElementById("keyword").value || "自由な旅"}
」
に関係するイベント・期間限定スポットなどを確認できます。

</p>

<p>

⚠️ 現在は試作版のため、
イベント情報は自動取得していません。

公開版では、
開催期間・予約開始日・料金・場所などの
最新情報を確認して表示する仕組みにします。

</p>

`;


document.getElementById(
"result"
).style.display="block";


document.getElementById(
"result"
).scrollIntoView({
behavior:"smooth"
});

}

/* =====================================
   シェア
===================================== */

function shareResult(){

if(!current)return;

const keyword=
document.getElementById(
"keyword"
).value;

const text=
"🎡 旅ルーレットで"+
current.name+
"に決まった！\n"+
"🎯 旅の目的："+(keyword||"秘密");

if(navigator.share){

navigator.share({
title:"旅ルーレット",
text:text,
url:location.href
});

}else{

alert(text);

}

}
