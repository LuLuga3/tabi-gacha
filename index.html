<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎰 タビガチャ｜次の旅を運で決めよう</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    Meiryo,
    sans-serif;
  background:linear-gradient(180deg,#f7fbff 0%,#fff8f0 100%);
  color:#222;
}

.container{
  width:100%;
  max-width:560px;
  margin:auto;
  padding:18px 14px 50px;
}

h1{
  text-align:center;
  font-size:30px;
  margin:8px 0 4px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:18px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.07);
}

.section-title{
  font-size:19px;
  font-weight:900;
  margin-bottom:12px;
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 7px;
}

.mode{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.mode button{
  border:0;
  border-radius:18px;
  padding:13px 8px;
  font-size:16px;
  font-weight:bold;
  background:#eee;
  color:#555;
}

.mode button.active{
  color:#fff;
  background:linear-gradient(135deg,#ff4f81,#ff8b5c);
}

.keyword-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.keyword{
  border:1px solid #ddd;
  background:#fff;
  border-radius:15px;
  padding:12px 7px;
  font-size:14px;
  font-weight:bold;
}

.keyword.selected{
  color:#fff;
  background:linear-gradient(135deg,#ff4f81,#ff8b5c);
  border-color:transparent;
}

.roulette-area{
  position:relative;
  margin:18px auto;
  width:100%;
  min-height:210px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.roulette{
  width:200px;
  height:200px;
  border-radius:50%;
  border:8px solid #fff;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  font-weight:bold;
  font-size:25px;
  background:
    conic-gradient(
      #ff6b6b 0deg 60deg,
      #ffd166 60deg 120deg,
      #06d6a0 120deg 180deg,
      #4dabf7 180deg 240deg,
      #9b5de5 240deg 300deg,
      #ff70a6 300deg 360deg
    );
  transition:transform 4s cubic-bezier(.12,.72,.15,1);
}

.pointer{
  position:absolute;
  top:-2px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  width:0;
  height:0;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-top:28px solid #222;
}

.spin-btn{
  width:100%;
  border:0;
  border-radius:18px;
  padding:17px;
  font-size:20px;
  font-weight:bold;
  color:#fff;
  background:linear-gradient(135deg,#ff477e,#ff8b3d);
  box-shadow:0 7px 18px rgba(255,71,126,.25);
}

.spin-btn:disabled{
  opacity:.5;
}

.result{
  display:none;
  text-align:center;
  animation:pop .5s ease;
}

.result.show{
  display:block;
}

@keyframes pop{
  0%{
    transform:scale(.7);
    opacity:0;
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

.result-title{
  color:#777;
  font-size:14px;
}

.result-place{
  font-size:34px;
  font-weight:900;
  margin:5px 0 12px;
}

.keyword-result{
  display:inline-block;
  background:#fff0f4;
  color:#e50046;
  padding:7px 13px;
  border-radius:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.area-box,
.hotel-box{
  background:#f8f8ff;
  border-radius:18px;
  padding:15px;
  margin-top:12px;
}

.area-label,
.hotel-label{
  font-size:13px;
  color:#777;
}

.area-name,
.hotel-name{
  font-size:21px;
  font-weight:900;
  margin:5px 0 12px;
}

.hotel-name{
  font-size:23px;
}

.reserve-btn{
  display:block;
  text-decoration:none;
  color:#fff;
  background:#e50046;
  border-radius:14px;
  padding:14px;
  font-weight:bold;
}

.small{
  color:#888;
  font-size:12px;
  margin-top:10px;
  line-height:1.6;
}

.history{
  font-size:13px;
}

.history-item{
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.badge{
  display:inline-block;
  background:#fff0f4;
  color:#e50046;
  border-radius:20px;
  padding:3px 8px;
  font-size:11px;
  margin-right:5px;
}

.hotel-loading{
  font-size:20px;
  font-weight:bold;
  animation:blink .5s infinite alternate;
}

@keyframes blink{
  from{opacity:.4}
  to{opacity:1}
}

.notice{
  text-align:center;
  color:#777;
  font-size:13px;
  line-height:1.7;
}

</style>
</head>

<body>

<div class="container">

<h1>🎰 タビガチャ</h1>

<div class="subtitle">
次の旅を、運にまかせて決めよう！
</div>


<!-- 行き先 -->

<div class="card">

<div class="section-title">
🌏 まずは行き先
</div>

<div class="mode">

<button id="japanBtn"
class="active"
onclick="setMode('japan')">
🇯🇵 日本
</button>

<button id="worldBtn"
onclick="setMode('world')">
🌎 世界
</button>

</div>

</div>


<!-- キーワード -->

<div class="card">

<div class="section-title">
🔎 旅のキーワード
</div>

<div class="notice">
今回の旅で重視したいことを1つ選んでください
</div>

<div class="keyword-grid">

<button class="keyword"
onclick="selectKeyword(this,'♨️ 温泉')">
♨️ 温泉
</button>

<button class="keyword"
onclick="selectKeyword(this,'💰 安く泊まりたい')">
💰 安く泊まりたい
</button>

<button class="keyword"
onclick="selectKeyword(this,'🍳 朝食を楽しみたい')">
🍳 朝食
</button>

<button class="keyword"
onclick="selectKeyword(this,'🏙️ 観光に便利')">
🏙️ 観光
</button>

<button class="keyword"
onclick="selectKeyword(this,'🚉 駅近')">
🚉 駅近
</button>

<button class="keyword"
onclick="selectKeyword(this,'🌿 ゆっくりしたい')">
🌿 癒やし
</button>

<button class="keyword"
onclick="selectKeyword(this,'✨ ちょっと贅沢')">
✨ 贅沢
</button>

<button class="keyword"
onclick="selectKeyword(this,'🍽️ 食事を楽しみたい')">
🍽️ 食事
</button>

</div>

</div>


<!-- ルーレット -->

<div class="card">

<div class="section-title">
🎰 行き先ルーレット
</div>

<div class="roulette-area">

<div class="pointer"></div>

<div id="roulette" class="roulette">
READY
</div>

</div>

<button
id="spinButton"
class="spin-btn"
onclick="spin()">
🎰 ガチャを回す！
</button>

</div>


<!-- 結果 -->

<div id="result" class="card result">

<div class="result-title">
🎉 今回の旅先は…
</div>

<div id="resultPlace" class="result-place">
北海道
</div>

<div id="keywordResult"
class="keyword-result">
🔎 キーワード
</div>

<div id="areaResult"></div>

<div id="hotelResult"></div>

</div>


<!-- 履歴 -->

<div class="card history">

<b>📜 最近のガチャ結果</b>

<div id="historyList">
まだありません
</div>

</div>


<div class="card small">

<b>💡 タビガチャの遊び方</b><br><br>

① 行き先をガチャで決める<br>
② 旅のキーワードを選ぶ<br>
③ 当たった場所のエリアを抽選<br>
④ キーワードを考慮してホテルを10件から抽選<br>
⑤ 最後は運命のホテルへ！

</div>

</div>


<script>

/* =========================
   現在の設定
========================= */

let currentMode = "japan";
let selectedKeyword = "";

let spinning = false;


/* =========================
   日本
========================= */

const japanPlaces = [

/* =========================
   世界
========================= */

const worldPlaces = [

"アメリカ",

"ドイツ",
"フィリピン",
"インドネシア",
"マレーシア"

];


/* =========================
   北海道6エリア
========================= */

const hokkaidoAreas = [

{
 name:"札幌",
 url:"https://a.r10.to/hPPMCt",
 hotels:[
  "札幌ホテル候補 01",
  "札幌ホテル候補 02",
  "札幌ホテル候補 03",
  "札幌ホテル候補 04",
  "札幌ホテル候補 05",
  "札幌ホテル候補 06",
  "札幌ホテル候補 07",
  "札幌ホテル候補 08",
  "札幌ホテル候補 09",
  "札幌ホテル候補 10"
 ]
},

{
 name:"函館",
 url:"https://a.r10.to/hPJvth",
 hotels:[
  "函館ホテル候補 01",
  "函館ホテル候補 02",
  "函館ホテル候補 03",
  "函館ホテル候補 04",
  "函館ホテル候補 05",
  "函館ホテル候補 06",
  "函館ホテル候補 07",
  "函館ホテル候補 08",
  "函館ホテル候補 09",
  "函館ホテル候補 10"
 ]
},

{
 name:"小樽",
 url:"https://a.r10.to/hk5v7l",
 hotels:[
  "小樽ホテル候補 01",
  "小樽ホテル候補 02",
  "小樽ホテル候補 03",
  "小樽ホテル候補 04",
  "小樽ホテル候補 05",
  "小樽ホテル候補 06",
  "小樽ホテル候補 07",
  "小樽ホテル候補 08",
  "小樽ホテル候補 09",
  "小樽ホテル候補 10"
 ]
},

{
 name:"旭川",
 url:"https://a.r10.to/hF1xVQ",
 hotels:[
  "旭川ホテル候補 01",
  "旭川ホテル候補 02",
  "旭川ホテル候補 03",
  "旭川ホテル候補 04",
  "旭川ホテル候補 05",
  "旭川ホテル候補 06",
  "旭川ホテル候補 07",
  "旭川ホテル候補 08",

 ]
},

{

 url:"https://a.r10.to/h5QccX",
 hotels:[
  "登別ホテル候補 01",
  "登別ホテル候補 02",
  "登別ホテル候補 03",
  "登別ホテル候補 04",
  "登別ホテル候補 05",
  "登別ホテル候補 06",
  "登別ホテル候補 07",

 ]
},

{
 name:"富良野",
 url:"https://a.r10.to/hRubqK",
 hotels:[
  "富良野ホテル候補 01",
  "富良野ホテル候補 02",
  "富良野ホテル候補 03",
  "富良野ホテル候補 04",
  "富良野ホテル候補 05",
  "富良野ホテル候補 06",
  "富良野ホテル候補 07",
  "富良野ホテル候補 08",
  "富良野ホテル候補 09",
  "富良野ホテル候補 10"
 ]
}

];


/* =========================
   モード変更
========================= */

function setMode(mode){

 currentMode = mode;

 document.getElementById("japanBtn")
 .classList.toggle(
   "active",
   mode === "japan"
 );

 document.getElementById("worldBtn")
 .classList.toggle(
   "active",
   mode === "world"
 );

}


/* =========================
   キーワード選択
========================= */

function selectKeyword(button,keyword){

 document
 .querySelectorAll(".keyword")
 .forEach(function(btn){

   btn.classList.remove("selected");

 });

 button.classList.add("selected");

 selectedKeyword = keyword;

}


/* =========================
   ランダム
========================= */

function randomItem(array){

 return array[
   Math.floor(
     Math.random()*array.length
   )
 ];

}


/* =========================
   ガチャ
========================= */

function spin(){

 if(spinning) return;

 spinning = true;

 const button =
   document.getElementById("spinButton");

 button.disabled = true;

 const roulette =
   document.getElementById("roulette");

 const result =
   document.getElementById("result");

 result.classList.remove("show");


 /* キーワード未選択なら自動選択 */

 if(!selectedKeyword){

   const buttons =
     document.querySelectorAll(".keyword");

   const randomButton =
     buttons[
       Math.floor(
         Math.random()*buttons.length
       )
     ];

   const keywordText =
     randomButton.textContent.trim();

   selectKeyword(
     randomButton,
     keywordText
   );

 }


 let place;

 if(currentMode === "japan"){

   place = randomItem(japanPlaces);

 }else{

   place = randomItem(worldPlaces);

 }


 /* ルーレット演出 */

 const rotations =
   5 + Math.floor(Math.random()*4);

 const randomDeg =
   Math.floor(Math.random()*360);

 roulette.style.transform =
   "rotate(" +
   (rotations*360+randomDeg) +
   "deg)";

 roulette.textContent = "GOGO!";


 setTimeout(function(){

   roulette.style.transform =
     "rotate(0deg)";

   roulette.textContent =
     place;

   showResult(place);

   spinning = false;

   button.disabled = false;

 },4200);

}


/* =========================
   結果
========================= */

function showResult(place){

 const result =
   document.getElementById("result");

 const resultPlace =
   document.getElementById("resultPlace");

 const keywordResult =
   document.getElementById("keywordResult");

 const areaResult =
   document.getElementById("areaResult");

 const hotelResult =
   document.getElementById("hotelResult");


 resultPlace.textContent =
   place;

 keywordResult.textContent =
   "🔎 キーワード：" +
   selectedKeyword;

 areaResult.innerHTML = "";
 hotelResult.innerHTML = "";


 /* 北海道 */

 if(place === "北海道"){

   const area =
     randomItem(hokkaidoAreas);


   areaResult.innerHTML =

   '<div class="area-box">' +

   '<div class="area-label">' +
   '🎯 北海道のエリア抽選' +
   '</div>' +

   '<div class="area-name">' +
   '📍 ' + area.name +
   '</div>' +

   '</div>';


   hotelResult.innerHTML =

   '<div class="hotel-box">' +

   '<div class="hotel-label">' +
   '🏨 キーワードを考慮してホテル抽選中…' +
   '</div>' +

   '<div class="hotel-name hotel-loading">' +
   '🎰 01 → 02 → 03 → 04 → 05…' +
   '</div>' +

   '</div>';


   /* ホテル抽選演出 */

   setTimeout(function(){

     const hotel =
       randomItem(area.hotels);

     hotelResult.innerHTML =

     '<div class="hotel-box">' +

     '<div class="hotel-label">' +
     '🎉 あなたのホテルは…' +
     '</div>' +

     '<div class="hotel-name">' +
     '🏨 ' + hotel +
     '</div>' +

     '<a class="reserve-btn"' +
     ' href="' + area.url + '"' +
     ' target="_blank"' +
     ' rel="noopener noreferrer">' +

     '🏨 このエリアのホテルを予約する →' +

     '</a>' +

     '<div class="small">' +
     '楽天トラベルの予約ページが開きます。' +
     '</div>' +

     '</div>';


     saveHistory(
       "北海道・" +
       area.name +
       "｜" +
       selectedKeyword
     );

   },1600);


 }else{

   areaResult.innerHTML =

   '<div class="area-box">' +

   '<div class="area-name">' +
   '✨ ' + place +
   '</div>' +

   '<div class="small">' +
   'この場所でキーワードに合うホテルを探してみよう！' +
   '</div>' +

   '</div>';


   saveHistory(
     place +
     "｜" +
     selectedKeyword
   );

 }


 result.classList.add("show");


 setTimeout(function(){

   result.scrollIntoView({
     behavior:"smooth",
     block:"center"
   });

 },300);

}


/* =========================
   履歴
========================= */

function saveHistory(text){

 const list =
   document.getElementById(
     "historyList"
   );


 if(list.textContent === "まだありません"){

   list.innerHTML = "";

 }


 const item =
   document.createElement("div");

 item.className =
   "history-item";

 item.innerHTML =
   '<span class="badge">NEW</span>' +
   text;


 list.prepend(item);


 while(list.children.length > 5){

   list.removeChild(
     list.lastChild
   );

 }

}

</script>

</body>
  </html>
