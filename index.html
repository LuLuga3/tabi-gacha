<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎡 旅ルーレット</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:
    -apple-system,BlinkMacSystemFont,"Noto Sans JP",
    "Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  background:linear-gradient(180deg,#fff7ed,#eef8ff);
  color:#222;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px 15px 40px;
}

h1{
  text-align:center;
  margin:5px 0 5px;
  font-size:30px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:22px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:bold;
  margin:13px 0 6px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

.mode{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.mode button{
  border:0;
  border-radius:18px;
  padding:18px 8px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  background:#f2f2f2;
}

.mode button.active{
  background:linear-gradient(135deg,#ff8a00,#ff4d4d);
  color:white;
  box-shadow:0 6px 15px rgba(255,90,40,.3);
}

.mode .world.active{
  background:linear-gradient(135deg,#267cff,#7b4dff);
}

#roulette{
  width:280px;
  height:280px;
  margin:20px auto;
  border-radius:50%;
  background:
    conic-gradient(
      #ff6b6b 0deg 45deg,
      #ffd93d 45deg 90deg,
      #6bcB77 90deg 135deg,
      #4d96ff 135deg 180deg,
      #c77dff 180deg 225deg,
      #ff9f1c 225deg 270deg,
      #00b4d8 270deg 315deg,
      #ff70a6 315deg 360deg
    );
  border:10px solid white;
  box-shadow:0 8px 30px rgba(0,0,0,.2);
  position:relative;
  transition:transform 5s cubic-bezier(.12,.75,.18,1);
}

#roulette::after{
  content:"";
  position:absolute;
  width:55px;
  height:55px;
  border-radius:50%;
  background:white;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 3px 8px rgba(0,0,0,.2);
}

.pointer{
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:35px solid #222;
  margin:0 auto -10px;
  position:relative;
  z-index:5;
}

.result{
  text-align:center;
  min-height:100px;
  padding:10px;
}

.result .country{
  font-size:15px;
  color:#777;
}

.result .place{
  font-size:32px;
  font-weight:900;
  margin:5px 0;
}

.result .mission{
  font-size:16px;
  color:#555;
}

.start{
  width:100%;
  border:0;
  border-radius:18px;
  padding:18px;
  font-size:22px;
  font-weight:900;
  color:white;
  background:linear-gradient(135deg,#ff512f,#dd2476);
  box-shadow:0 8px 20px rgba(220,40,90,.3);
  cursor:pointer;
}

.start:active{
  transform:scale(.97);
}

.stop{
  display:none;
  width:100%;
  border:0;
  border-radius:18px;
  padding:18px;
  font-size:22px;
  font-weight:900;
  color:white;
  background:#222;
  cursor:pointer;
}

.info{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:12px;
}

.hidden{
  display:none;
}

.share{
  width:100%;
  border:0;
  border-radius:14px;
  padding:13px;
  background:#f1f1f1;
  font-weight:bold;
  margin-top:10px;
}

.keyword-box{
  background:#fff8df;
  border-radius:14px;
  padding:12px;
  margin-top:12px;
  font-size:14px;
}

.flash{
  animation:pop .5s ease;
}

@keyframes pop{
  0%{transform:scale(.7);opacity:.2}
  70%{transform:scale(1.08)}
  100%{transform:scale(1);opacity:1}
}
</style>
</head>

<body>

<div class="container">

<h1>🎡 旅ルーレット</h1>
<div class="subtitle">次の旅、運に任せてみない？</div>

<div class="card">

<label>📍 出発地</label>
<input id="from" placeholder="例：東京、大阪、札幌">

<label>📅 旅行する日</label>
<input id="date" type="date">

<label>💰 予算</label>
<select id="budget" style="
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;">
<option>特に決めてない</option>
<option>1万円以内</option>
<option>3万円以内</option>
<option>5万円以内</option>
<option>10万円以内</option>
<option>10万円以上</option>
</select>

<label>🎯 旅のキーワード</label>
<input id="keyword" placeholder="例：温泉、絶景、グルメ、推し活">

<div class="keyword-box">
💡 キーワードを入れると、当選した場所に合わせて
「旅のミッション」が表示されます。
</div>

</div>

<div class="card">

<h2 style="text-align:center">🌏 どこへ行く？</h2>

<div class="mode">

<button id="japanBtn" onclick="selectMode('japan')">
🇯🇵<br>日本
</button>

<button id="worldBtn" class="world" onclick="selectMode('world')">
🌎<br>世界
</button>

</div>

</div>

<div class="card">

<div class="pointer"></div>

<div id="roulette"></div>

<button class="start" id="startBtn" onclick="startRoulette()">
🎰 START
</button>

<button class="stop" id="stopBtn" onclick="stopRoulette()">
🛑 STOP
</button>

<div class="info">
ルーレットが止まった場所が、あなたの次の旅先！
</div>

<div class="result" id="result">
<div class="country">まだ結果がありません</div>
<div class="place">？？？</div>
<div class="mission">日本か世界を選んでSTART！</div>
</div>

<button class="share hidden" id="shareBtn" onclick="shareResult()">
📱 結果をシェア
</button>

</div>

</div>

<script>

const japan = [
"北海道・札幌",
"北海道・函館",
"青森",
"秋田",
"岩手",
"宮城・仙台",
"山形",
"福島",
"新潟",
"長野",
"金沢",
"富山",
"東京",
"横浜",
"鎌倉",
"箱根",
"伊豆",
"名古屋",
"京都",
"大阪",
"神戸",
"奈良",
"和歌山",
"岡山",
"広島",
"香川・高松",
"愛媛・松山",
"福岡",
"長崎",
"熊本",
"鹿児島",
"沖縄"
];

const world = [
"🇰🇷 韓国・ソウル",
"🇰🇷 韓国・釜山",
"🇹🇼 台湾・台北",
"🇹🇼 台湾・台中",
"🇭🇰 香港",
"🇹🇭 タイ・バンコク",
"🇹🇭 タイ・プーケット",
"🇸🇬 シンガポール",
"🇻🇳 ベトナム・ホーチミン",
"🇻🇳 ベトナム・ダナン",
"🇲🇾 マレーシア・クアラルンプール",
"🇮🇩 インドネシア・バリ",
"🇵🇭 フィリピン・セブ",
"🇦🇺 オーストラリア・シドニー",
"🇬🇺 グアム",
"🇺🇸 ハワイ",
"🇺🇸 ニューヨーク",
"🇺🇸 ロサンゼルス",
"🇨🇦 カナダ・バンクーバー",
"🇫🇷 フランス・パリ",
"🇬🇧 イギリス・ロンドン",
"🇮🇹 イタリア・ローマ",
"🇪🇸 スペイン・バルセロナ",
"🇨🇭 スイス・チューリッヒ",
"🇩🇪 ドイツ・ベルリン",
"🇳🇱 オランダ・アムステルダム",
"🇦🇹 オーストリア・ウィーン",
"🇬🇷 ギリシャ・サントリーニ",
"🇹🇷 トルコ・イスタンブール",
"🇪🇬 エジプト・カイロ"
];

let mode = "japan";
let spinning = false;
let stopped = false;
let currentRotation = 0;
let selectedPlace = "";

const roulette = document.getElementById("roulette");

selectMode("japan");

function selectMode(type){

  if(spinning) return;

  mode = type;

  document.getElementById("japanBtn")
    .classList.toggle("active",type==="japan");

  document.getElementById("worldBtn")
    .classList.toggle("active",type==="world");

  const list = type==="japan" ? japan : world;

  document.querySelector(".place").textContent =
    type==="japan" ? "🇯🇵 日本ルーレット" : "🌎 世界ルーレット";

  document.querySelector(".country").textContent =
    list.length + "ヶ所からランダム";

  document.querySelector(".mission").textContent =
    "STARTを押して運命を決めよう！";
}

function startRoulette(){

  if(spinning) return;

  spinning = true;
  stopped = false;

  document.getElementById("startBtn").style.display="none";
  document.getElementById("stopBtn").style.display="block";
  document.getElementById("shareBtn").classList.add("hidden");

  selectedPlace = "";

  const list = mode==="japan" ? japan : world;

  const randomIndex =
    Math.floor(Math.random()*list.length);

  selectedPlace = list[randomIndex];

  /*
    最初は結果を隠して、
    STOPしたタイミングで決定。
  */

  const extraSpins = 8 + Math.floor(Math.random()*5);

  currentRotation +=
    extraSpins * 360 +
    Math.floor(Math.random()*360);

  roulette.style.transform =
    `rotate(${currentRotation}deg)`;

  document.querySelector(".place").textContent="？？？";
  document.querySelector(".country").textContent="回転中……";
  document.querySelector(".mission").textContent="STOPで旅先決定！";

  // 自動停止
  setTimeout(()=>{

    if(spinning){
      stopRoulette();

    }

  },5200);

}

function stopRoulette(){

  if(!spinning) return;

  spinning=false;
  stopped=true;

  document.getElementById("startBtn").style.display="block";
  document.getElementById("stopBtn").style.display="none";

  showResult();

}

function showResult(){

  const keyword =
    document.getElementById("keyword").value.trim();

  document.querySelector(".country").textContent =
    mode==="japan"
    ? "🇯🇵 日本の旅先"
    : "🌎 世界の旅先";

  const placeElement =
    document.querySelector(".place");

  placeElement.textContent = selectedPlace;

  placeElement.classList.remove("flash");

  void placeElement.offsetWidth;

  placeElement.classList.add("flash");

  let mission = createMission(selectedPlace,keyword);

  document.querySelector(".mission").textContent =
    "🎯 " + mission;

  document.getElementById("shareBtn")
    .classList.remove("hidden");

}

function createMission(place,keyword){

  if(keyword){

    return `「${keyword}」をテーマに${place}で写真を1枚撮る！`;

  }

  const missions = [

    "ご当地グルメを1つ食べる！",

    "地元の人しか知らなそうな場所を探す！",

    "その場所の絶景を1枚撮る！",

    "ご当地のお土産を1つ買う！",

    "その土地でしかできない体験をする！",

    "朝から観光してみる！",

    "有名スポット以外の場所へ行ってみる！",

    "旅先で新しい店に入ってみる！"

  ];

  return missions[
    Math.floor(Math.random()*missions.length)
  ];

}

async function shareResult(){

  const keyword =
    document.getElementById("keyword").value.trim();

  const text =
`🎡 旅ルーレット

${mode==="japan" ? "🇯🇵 日本" : "🌎 世界"}
📍 ${selectedPlace}

🎯 ${createMission(selectedPlace,keyword)}

次の旅、運に任せてみない？`;

  if(navigator.share){

    try{

      await navigator.share({
        title:"🎡 旅ルーレット",
        text:text
      });

    }catch(e){}

  }else{

    await navigator.clipboard.writeText(text);

    alert("結果をコピーしました！");

  }

}

</script>

</body>
</html>
