<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎡 旅ルーレット</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  background:radial-gradient(circle at top,#dbeafe,#fff7ed 60%,#fef3c7);
  color:#20242a;
  min-height:100vh;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:26px 15px;
}

header h1{
  margin:0;
  font-size:31px;
}

header p{
  margin:8px 0 0;
  opacity:.8;
}

main{
  max-width:650px;
  margin:auto;
  padding:18px 14px 70px;
}

.card{
  background:white;
  border-radius:24px;
  padding:21px;
  margin-bottom:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.09);
}

h2{
  text-align:center;
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

input,
select{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:13px;
  font-size:16px;
  background:white;
}

button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:15px;
  margin-top:12px;
  background:#2563eb;
  color:white;
  font-size:18px;
  font-weight:bold;
  transition:.15s;
}

button:active{
  transform:scale(.96);
}

button:disabled{
  opacity:.45;
}

.stop{
  background:#ef4444;
}

.dark{
  background:#111827;
}

.green{
  background:#16a34a;
}

.orange{
  background:#f97316;
}

.hidden{
  display:none!important;
}

.hint{
  color:#777;
  font-size:13px;
  line-height:1.6;
  margin-top:6px;
}


/* ==============================
   ルーレット
============================== */

.roulette-area{
  position:relative;
  width:330px;
  height:390px;
  margin:5px auto 0;
}

.pointer{
  position:absolute;
  z-index:20;
  top:0;
  left:50%;
  transform:translateX(-50%);
  font-size:52px;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));
}

.wheel-wrap{
  position:absolute;
  top:46px;
  left:15px;
  width:300px;
  height:300px;
}

#wheel{
  width:300px;
  height:300px;
  border-radius:50%;
  border:8px solid white;
  box-shadow:0 12px 35px rgba(0,0,0,.22);
  transform:rotate(0rad);
}

.wheel-center{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:68px;
  height:68px;
  border-radius:50%;
  background:#111827;
  border:6px solid white;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  z-index:5;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}

.spin-status{
  text-align:center;
  min-height:32px;
  font-size:18px;
  font-weight:bold;
}


/* ==============================
   カウントダウン
============================== */

.countdown{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(17,24,39,.88);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.count-number{
  font-size:110px;
  font-weight:900;
  animation:countPop .8s ease;
}

@keyframes countPop{
  0%{
    transform:scale(.3);
    opacity:0;
  }

  50%{
    transform:scale(1.3);
    opacity:1;
  }

  100%{
    transform:scale(1);
  }
}


/* ==============================
   結果
============================== */

.result{
  text-align:center;
}

.result-emoji{
  font-size:75px;
}

.result-name{
  font-size:42px;
  font-weight:900;
  margin:5px 0;
}

.luck{
  display:inline-block;
  padding:8px 16px;
  border-radius:30px;
  background:#fef3c7;
  font-weight:bold;
  margin:8px 0 15px;
}


/* ==============================
   紙吹雪
============================== */

.confetti{
  position:fixed;
  top:-20px;
  width:10px;
  height:18px;
  z-index:200;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:
      translateY(110vh)
      rotate(720deg);
  }
}


/* ==============================
   結果ボックス
============================== */

.result-box{
  background:#f8fafc;
  border-radius:15px;
  padding:15px;
  text-align:left;
  margin-top:12px;
  line-height:1.7;
}

.mission{
  background:#f3f4f6;
  border-radius:14px;
  padding:14px;
  margin:9px 0;
  text-align:left;
}

.mission input{
  width:auto;
  margin-right:7px;
}

.special{
  background:#fff8dc;
  border:2px solid #f5c542;
  border-radius:15px;
  padding:15px;
  margin-top:15px;
  text-align:left;
  line-height:1.7;
}

.tag{
  display:inline-block;
  padding:4px 9px;
  border-radius:20px;
  background:#e0f2fe;
  color:#0369a1;
  font-size:12px;
}

footer{
  text-align:center;
  color:#777;
  font-size:12px;
  padding:20px;
}
</style>
</head>

<script>


/* =========================================

========================================= */

const japan=[

["北海道","🐻","北海道","海鮮・ラーメン・自然"],
["青森県","🍎","東北","りんご・ねぶた・海鮮"],

["鳥取県","🏜️","中国","砂丘・海鮮"],

["徳島県","💃","四国","阿波踊り・海"],
["香川県","🍜","四国","讃岐うどん"],

["沖縄県","🌴","九州","海・沖縄料理"]

];


/* =========================================
   世界
========================================= */

const world=[

["韓国","🇰🇷","アジア","韓国料理・カフェ"],
["台湾","🇹🇼","アジア","夜市・小籠包"],
["タイ","🇹🇭","アジア","屋台・寺院"],
["ベトナム","🇻🇳","アジア","フォー・市場"],
["シンガポール","🇸🇬","アジア","グルメ・夜景"],
["マレーシア","🇲🇾","アジア","多文化・グルメ"],
["インドネシア","🇮🇩","アジア","ビーチ・寺院"],
["フィリピン","🇵🇭","アジア","海・リゾート"],

["フランス","🇫🇷","ヨーロッパ","パン・美術館"],
["イタリア","🇮🇹","ヨーロッパ","ピザ・歴史"],
["スペイン","🇪🇸","ヨーロッパ","料理・建築"],
["イギリス","🇬🇧","ヨーロッパ","紅茶・歴史"],
["ドイツ","🇩🇪","ヨーロッパ","街並み・城"],
["スイス","🇨🇭","ヨーロッパ","山・鉄道"],
["ポルトガル","🇵🇹","ヨーロッパ","街並み・海"],
["ギリシャ","🇬🇷","ヨーロッパ","島・遺跡"],

["アメリカ","🇺🇸","北米","都市・自然"],
["カナダ","🇨🇦","北米","自然・絶景"],
["メキシコ","🇲🇽","中南米","料理・遺跡"],

["オーストラリア","🇦🇺","オセアニア","海・自然"],
["ニュージーランド","🇳🇿","オセアニア","自然・絶景"],

["モロッコ","🇲🇦","アフリカ","市場・料理"],
["南アフリカ","🇿🇦","アフリカ","自然・動物"]

];


const places=[

...japan.map(x=>({
  name:x[0],
  emoji:x[1],
  region:x[2],
  food:x[3]
})),

...world.map(x=>({
  name:x[0],
  emoji:x[1],
  region:x[2],
  food:x[3]
}))

];


/* =========================================
   状態
========================================= */

let candidates=places;

let current=null;

let spinning=false;

let rotation=0;

let animation=null;

let audioContext=null;


/* =========================================
   Canvas
========================================= */

const canvas=
document.getElementById("wheel");

const ctx=
canvas.getContext("2d");


function drawWheel(){

ctx.clearRect(0,0,300,300);

const center=150;

const radius=145;

const slice=
Math.PI*2/candidates.length;

const colors=[

"#60a5fa",
"#fbbf24",
"#f87171",
"#34d399",
"#a78bfa",
"#fb923c",
"#38bdf8",
"#f472b6"

];


candidates.forEach((place,i)=>{

const start=i*slice;

const end=start+slice;


ctx.beginPath();

ctx.moveTo(center,center);

ctx.arc(
  center,
  center,
  radius,
  start,
  end
);

ctx.closePath();

ctx.fillStyle=
colors[i%colors.length];

ctx.fill();


ctx.save();

ctx.translate(center,center);

ctx.rotate(
  start+slice/2
);

ctx.fillStyle="white";

ctx.font=
candidates.length>35
?
"bold 8px sans-serif"
:
"bold 11px sans-serif";

ctx.textAlign="right";

ctx.fillText(
  place.name,
  radius-8,
  4
);

ctx.restore();

});

}


drawWheel();


/* =========================================
   効果音
========================================= */

function initAudio(){

if(!audioContext){

audioContext=
new(
window.AudioContext||
window.webkitAudioContext
)();

}

}


function beep(
frequency=440,
duration=.08,
type="sine"
){

try{

initAudio();

const osc=
audioContext.createOscillator();

const gain=
audioContext.createGain();

osc.type=type;

osc.frequency.value=
frequency;

gain.gain.setValueAtTime(
  .08,
  audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
  .001,
  audioContext.currentTime+duration
);

osc.connect(gain);

gain.connect(
  audioContext.destination
);

osc.start();

osc.stop(
  audioContext.currentTime+duration
);

}catch(e){}

}


/* =========================================
   ルーレット表示
========================================= */

function startDestinationMode(){

document
.getElementById("rouletteCard")
.classList
.remove("hidden");

document
.getElementById("rouletteCard")
.scrollIntoView({
  behavior:"smooth"
});

}


function startAllMode(){

document
.getElementById("rouletteCard")
.classList
.remove("hidden");

document
.getElementById("rouletteCard")
.scrollIntoView({
  behavior:"smooth"
});

}


/* =========================================
   カウントダウン
========================================= */

function countdown(){

return new Promise(resolve=>{

const overlay=
document.getElementById("countdown");

const number=
document.getElementById("countNumber");

overlay.classList.remove("hidden");

let n=3;

number.textContent=n;

beep(440,.12);


const timer=
setInterval(()=>{

n--;

if(n>0){

number.textContent=n;

number.style.animation="none";

void number.offsetWidth;

number.style.animation=
"countPop .8s ease";

beep(
  n===2?520:620,
  .12
);

}else{

clearInterval(timer);

number.textContent="START!";

number.style.animation=
"countPop .8s ease";

beep(
  880,
  .25,
  "square"
);

setTimeout(()=>{

overlay.classList.add("hidden");

resolve();

},600);

}

},850);

});

}


/* =========================================
   回転開始
========================================= */

async function startSpin(){

if(spinning)return;

await countdown();

spinning=true;

document
.getElementById("spinButton")
.disabled=true;

document
.getElementById("stopButton")
.disabled=false;

document
.getElementById("spinStatus")
.textContent=
"🎡 回ってる！止めたいところでSTOP！";


let speed=.04;


function animate(){

if(!spinning)return;

speed+=.001;

if(speed>.30){
speed=.30;
}

rotation+=speed;

canvas.style.transform=
"rotate("+rotation+"rad)";


if(
Math.floor(rotation*20)%3===0
){

beep(
  180+speed*500,
  .025
);

}


animation=
requestAnimationFrame(animate);

}


animate();

}


/* =========================================
   STOP
========================================= */

function stopSpin(){

if(!spinning)return;

spinning=false;

cancelAnimationFrame(animation);

document
.getElementById("stopButton")
.disabled=true;

document
.getElementById("spinStatus")
.textContent=
"🛑 STOP！";


let speed=.22;


function slow(){

rotation+=speed;

canvas.style.transform=
"rotate("+rotation+"rad)";


beep(
  Math.max(100,speed*500),
  .025
);

speed*=.93;


if(speed>.002){

requestAnimationFrame(slow);

}else{

finish();

}

}


slow();

}


/* =========================================
   結果決定
========================================= */

function finish(){

const slice=
Math.PI*2/candidates.length;


let normalized=
(
  (-rotation%(Math.PI*2))
  +
  Math.PI*2
)
%(Math.PI*2);


let index=
Math.floor(
  normalized/slice
);


current=
candidates[index];


beep(660,.12);

setTimeout(
  ()=>beep(880,.18),
  120
);

setTimeout(
  ()=>beep(1100,.3),
  280
);


showResult();

}


/* =========================================
   ミッション
========================================= */

function makeMissions(){

const keyword=
document

let missions=[];


if(keyword){

missions.push(
"🎯 "+
current.name+
"で「"+
keyword+

);

missions.push(
"📸 「"+
keyword+
"」をテーマに写真を1枚撮る"
);

missions.push(
"🔎 「"+
keyword+
"」に関係するものを旅先で1つ発見する"
);

}


missions.push(
"🍴 "+
current.name+
"のご当地グルメを食べる"
);

missions.push(
"🗺️ "+
current.name+
"で行ったことのない場所へ行く"
);

missions.push(

);

}

/* =========================================
   紙吹雪
========================================= */

function confetti(){

for(let i=0;i<70;i++){

const piece=
document.createElement("div");

piece.className=
"confetti";

piece.style.left=
Math.random()*100+
"vw";

piece.style.animationDuration=
(2+Math.random()*3)+
"s";

piece.style.transform=
"rotate("+
Math.random()*360+
"deg)";

piece.style.background=
[
"#ef4444",
"#f59e0b",
"#10b981",
"#3b82f6",
"#8b5cf6",
"#ec4899"
][
Math.floor(
  Math.random()*6
)
];


document.body.appendChild(piece);


setTimeout(
  ()=>piece.remove(),
  6000
);

}

}
